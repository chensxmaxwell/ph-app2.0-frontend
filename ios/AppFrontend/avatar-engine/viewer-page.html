<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #status { display: none;
    position: absolute; left: 16px; right: 16px; top: 46%;
    text-align: center; color: #f3f3f3;
    background: rgba(0,0,0,0.42);
    border-radius: 10px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.85);
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, sans-serif;
    pointer-events: none;
    padding: 8px 16px;
    margin: 0 auto;
    max-width: 280px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status" hidden></div>
<script src="three.min.js"></script>
<script src="GLTFLoader.js?v=3"></script>
<script>
(function () {
  var HAIR_COLORS = ["#1a1410","#5c3310","#d4b483","#8b2a1a","#e891b0","#d0d0d0"];
  var SKIN_COLORS = ["#f3d0bc","#e2b089","#c17a45","#8a4f28"];
  var EYE_COLORS = ["#3a2418","#3f6b3a","#2e4d7a","#5a3a1e","#111111"];
  var look = {
    appearanceIndex: 2, hairStyle: 2, hairColor: 1, skinTone: 1, eyeColor: 0,
    upperArms: 0.45, chest: 0.5, forearms: 0.45, backAndHips: 0.48,
    faceWidth: 0.48, jaw: 0.46, chin: 0.5, eyeSize: 0.5, age: 0.28,
    viewMode: "full", revealBody: false
  };

  var renderer, scene, camera;
  var modelRoot, morphMeshes = [];
  var modelRestY = 0;
  var skinMats = [];
  var headMats = [];
  var hairMats = [];
  var eyeMats = [];
  var headBones = [];
  var headRests = [];
  var eyeBones = [];
  var eyeRests = [];
  var armBones = [];
  var armRests = [];
  var masterBones = {};
  var FALLBACK_HEIGHT = 1.75;
  var MIN_PLAUSIBLE_HEIGHT = 1.2;
  var modelHeight = FALLBACK_HEIGHT;
  var pendingLook = null;
  var ready = false;
  var clock = 0;

  function setStatus(text) {
    var el = document.getElementById("status");
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }

  function clamp01(v) { return Math.max(0, Math.min(1, Number(v) || 0)); }
  function hexColor(hex) { return new THREE.Color(hex); }

  function materialsOf(obj) {
    if (!obj.material) return [];
    return Array.isArray(obj.material) ? obj.material : [obj.material];
  }

  function setMorph(mesh, name, value) {
    if (!mesh.morphTargetDictionary) return;
    var idx = mesh.morphTargetDictionary[name];
    if (idx === undefined) return;
    mesh.morphTargetInfluences[idx] = clamp01(value);
  }

  function pruneToShapes(mesh) {
    var dict = mesh.morphTargetDictionary || {};
    var geo = mesh.geometry;
    if (!geo || !geo.morphAttributes) return;
    var keepIdx = [];
    var nextDict = {};
    Object.keys(dict).forEach(function (name) {
      if (!name || name.indexOf("Shape_") !== 0) return;
      var index = dict[name];
      if (typeof index !== "number") return;
      var positions = geo.morphAttributes.position;
      if (positions && !positions[index]) return;
      var normals = geo.morphAttributes.normal;
      if (normals && !normals[index]) return;
      nextDict[name] = keepIdx.length;
      keepIdx.push(index);
    });
    ["position", "normal"].forEach(function (key) {
      var arr = geo.morphAttributes[key];
      if (!arr) return;
      geo.morphAttributes[key] = keepIdx.map(function (i) { return arr[i]; });
    });
    if (!geo.morphAttributes.normal || !geo.morphAttributes.normal.length) {
      delete geo.morphAttributes.normal;
    }
    mesh.morphTargetDictionary = nextDict;
    mesh.morphTargetInfluences = keepIdx.map(function () { return 0; });
  }

  function mild(v, amount) {
    return clamp01(v) * (amount == null ? 0.28 : amount);
  }

  // Head_0's Shape_EyeLidHeight drops the upper lid (about 15mm at 1.0, the
  // lower lid barely moves). At rest the BoZo lids open ~24deg above and
  // ~32deg below the iris axis - a round, startled aperture that TestFlight
  // 1.2 (12) read as a horror-doll stare. 0.16 (the default Eyes setting)
  // brings the upper lid to about +14deg, so it rests on the top of the iris
  // like a relaxed eye while the pupil stays clear; the Eyes slider opens it
  // a little for bigger eyes. Stay under ~0.27, where the lid starts to
  // cross the pupil, and far from 0.45, where it crosses the iris centre.
  function upperLidDrop(eyeSize) {
    return UPPER_LID_DROP - clamp01(eyeSize) * 0.08;
  }

  function applyMeshLook(mesh, next) {
    var arms = (clamp01(next.upperArms) + clamp01(next.forearms)) * 0.5;
    var hips = clamp01(next.backAndHips);
    var eye = clamp01(next.eyeSize);
    setMorph(mesh, "Shape_Squareness", mild(next.faceWidth, 0.22));
    setMorph(mesh, "Shape_Stern", mild(next.jaw, 0.22));
    setMorph(mesh, "Shape_Sharpness", mild(next.chin, 0.18));
    setMorph(mesh, "Shape_EyesSquare", mild(next.faceWidth, 0.1));
    setMorph(mesh, "Shape_EyeLidHeight", upperLidDrop(eye));
    setMorph(mesh, "Shape_NoseWidth", mild(next.faceWidth, 0.16));
    setMorph(mesh, "Shape_MouthWide", mild(next.faceWidth, 0.14));
    setMorph(mesh, "Shape_MouthThin", (1 - clamp01(next.chin)) * 0.1);
    // Raised brows over wide lids read as shock; keep them nearly neutral.
    setMorph(mesh, "Shape_RaiseBrows", 0.02 + eye * 0.04);
    setMorph(mesh, "Shape_LowerBrows", mild(next.jaw, 0.08));
    setMorph(mesh, "Shape_NoseTiltDown", mild(next.chin, 0.08));
    setMorph(mesh, "Shape_LashLength", 0.42);
    setMorph(mesh, "Shape_BrowsThickness", 0.32);
    setMorph(mesh, "Shape_Chest", clamp01(next.chest));
    setMorph(mesh, "Shape_Muscle", arms);
    setMorph(mesh, "Shape_ButtSize", hips);
    setMorph(mesh, "Shape_WaistSize", hips * 0.72);
    setMorph(mesh, "Shape_Curvy", hips * 0.4);
    setMorph(mesh, "Shape_Belly", Math.max(0, hips - 0.55) * 0.7);
    setMorph(mesh, "Shape_Weight", clamp01(next.age) * 0.28 + Math.max(0, hips - 0.65) * 0.35);
    setMorph(mesh, "Shape_NeckThickness", mild(next.jaw, 0.22));
    setMorph(mesh, "Shape_BodyType", arms * 0.35);
  }

  function prefixIndex(name, prefix) {
    if (!name || name.indexOf(prefix) !== 0) return -1;
    var parsed = parseInt(name.slice(prefix.length), 10);
    return isNaN(parsed) ? -1 : parsed;
  }

  // Skin parts (Body_<Part> meshes) that each outfit leaves uncovered. Derived
  // from the bones each garment is skinned to in bozo-male.glb:
  //   0 Shirt (short sleeve, ends at upperarm_twist_02) + Jeans + SportsShoes
  //   1 CasualJacket (sleeve reaches hand_l/r) + CargoPants + WorkBoots
  //   2 Hoodie (cuff reaches hand + thumb_01) + BaggyPants + StreetShoes
  //   3 TankTop (clavicle/upperarm root only) + DressPants + ComfyShoes
  // Hands must be listed for every outfit or the character has no hands.
  var SKIN_BY_OUTFIT = {
    0: { Hand: 1, Wrist: 1, LowerArm: 1, UpperArm: 1, Neck: 1 },
    1: { Hand: 1, Neck: 1 },
    2: { Hand: 1, Neck: 1 },
    3: { Hand: 1, Wrist: 1, LowerArm: 1, UpperArm: 1, Shoulder: 1, Neck: 1 }
  };

  function bodyPart(name) {
    if (!name || name.indexOf("Body_") !== 0) return "";
    return name.slice(5);
  }

  function nameHasExposedSkin(name, outfit) {
    var allowed = SKIN_BY_OUTFIT[outfit] || SKIN_BY_OUTFIT[0];
    return !!allowed[bodyPart(name)];
  }

  function isFigureMesh(name) {
    return (
      name.indexOf("Body_") === 0 ||
      name.indexOf("Head_") === 0 ||
      name.indexOf("Eyes_") === 0 ||
      name.indexOf("Outfit_") === 0 ||
      name.indexOf("Hair_") === 0
    );
  }

  var _sample = new THREE.Vector3();

  // World-space point of vertex `index`. Skinned vertices must go through the
  // skeleton: bozo-male.glb stores them in armature space and the armature
  // node carries a 90deg + 0.01 transform, so position * matrixWorld lays the
  // figure on its side at centimetre scale (Y extent ~0.003).
  function sampleMeshPoint(obj, index, target) {
    if (obj.isSkinnedMesh && typeof obj.boneTransform === "function") {
      obj.boneTransform(index, target);
      return obj.localToWorld(target);
    }
    target.fromBufferAttribute(obj.geometry.attributes.position, index);
    return obj.localToWorld(target);
  }

  function measureFigureBox(box, filter, includeHidden) {
    box.makeEmpty();
    if (!modelRoot) return box;
    modelRoot.updateMatrixWorld(true);
    modelRoot.traverse(function (obj) {
      if (!obj.isMesh || !obj.geometry || !obj.geometry.attributes.position) return;
      if (!obj.visible && !includeHidden) return;
      var name = obj.name || "";
      if (!isFigureMesh(name)) return;
      if (filter && !filter(name)) return;
      var pos = obj.geometry.attributes.position;
      var stride = Math.max(1, Math.floor(pos.count / 400));
      var i;
      for (i = 0; i < pos.count; i += stride) {
        box.expandByPoint(sampleMeshPoint(obj, i, _sample));
      }
    });
    return box;
  }

  function placeFigure() {
    // Measure in the rest pose so grounding/centering does not drift per outfit.
    resetArmBones();
    var box = measureFigureBox(new THREE.Box3());
    if (box.isEmpty()) {
      box.setFromObject(modelRoot);
    }
    var size = box.getSize(new THREE.Vector3());
    var center = box.getCenter(new THREE.Vector3());
    modelHeight = figureHeight(size.y);
    if (modelHeight === size.y) {
      modelRoot.position.x -= center.x;
      modelRoot.position.z -= center.z;
      modelRoot.position.y -= box.min.y;
    }
    modelRestY = modelRoot.position.y;
  }

  // A measured height below MIN_PLAUSIBLE_HEIGHT means the box did not come
  // from the skinned figure (e.g. raw positions); frame a nominal adult instead
  // of zooming the camera onto the shins.
  function figureHeight(measuredY) {
    if (typeof measuredY === "number" && measuredY >= MIN_PLAUSIBLE_HEIGHT) return measuredY;
    return FALLBACK_HEIGHT;
  }

  // GLTFLoader renames duplicate nodes (hand_l, hand_l_1, hand_l_2...); the
  // glTF name survives in userData.name.
  function rigName(obj) {
    return (obj && ((obj.userData && obj.userData.name) || obj.name)) || "";
  }

  // The GLB carries one armature per imported kit piece (23 copies of the same
  // bone names). Three of the hair rigs (Hair_0_0_0, Hair_1_1_0, Hair_3_1_0)
  // were exported with a displaced pelvis, so their meshes rendered 1.4m off
  // the body. Drive every mesh from one master skeleton, matched by bone name;
  // hair-only bones (HairFront, Hair_Back...) are re-attached under the master
  // head so they follow it.
  function retargetSkeletons(root) {
    var armatures = [];
    root.traverse(function (obj) {
      if (obj.isBone && obj.parent && !obj.parent.isBone) armatures.push(obj);
    });
    var best = null;
    armatures.forEach(function (arm) {
      var count = 0;
      arm.traverse(function (b) { if (b.isBone) count += 1; });
      if (!best || count > best.count) best = { bone: arm, count: count };
    });
    masterBones = {};
    if (!best) return;
    best.bone.traverse(function (b) {
      var key = rigName(b);
      if (b.isBone && !masterBones[key]) masterBones[key] = b;
    });
    root.updateMatrixWorld(true);
    var meshes = [];
    root.traverse(function (obj) {
      if (obj.isSkinnedMesh && obj.skeleton) meshes.push(obj);
    });
    meshes.forEach(function (mesh) {
      var bones = mesh.skeleton.bones.map(function (bone) {
        var master = masterBones[rigName(bone)];
        if (master) return master;
        var parent = bone.parent;
        var masterParent = parent && parent.isBone ? masterBones[rigName(parent)] : null;
        if (masterParent && parent !== masterParent) {
          masterParent.attach(bone);
        }
        return bone;
      });
      mesh.bind(new THREE.Skeleton(bones, mesh.skeleton.boneInverses), mesh.bindMatrix);
    });
    root.updateMatrixWorld(true);
  }

  // Which figure meshes a look draws. Hair_<i>_* / Outfit_<i>_* follow the
  // selected indices; Head_* and Eyes_* are always on (Eyes_0 is the eyeball
  // mesh with the MAT_Iris shader - hiding it leaves empty sockets); Body_*
  // skin parts show only where the outfit leaves skin uncovered, or when the
  // Body sliders reveal the body through faded clothes.
  function figureMeshVisible(name, next) {
    if (name.indexOf("Icosphere") === 0) return false;
    var hairIdx = prefixIndex(name, "Hair_");
    if (hairIdx >= 0) return hairIdx === (next.hairStyle | 0);
    var outfitIdx = prefixIndex(name, "Outfit_");
    if (outfitIdx >= 0) return outfitIdx === (next.appearanceIndex | 0);
    if (name.indexOf("Head_") === 0 || name.indexOf("Eyes_") === 0) return true;
    if (name.indexOf("Body_") === 0) {
      return !!next.revealBody || nameHasExposedSkin(name, next.appearanceIndex | 0);
    }
    return true;
  }

  function applyOutfitFade(obj, faded) {
    materialsOf(obj).forEach(function (mat) {
      if (!mat || typeof mat !== "object") return;
      if (!mat._phOrig) {
        mat._phOrig = {
          transparent: !!mat.transparent,
          opacity: typeof mat.opacity === "number" ? mat.opacity : 1,
          depthWrite: mat.depthWrite !== false
        };
      }
      if (faded) {
        mat.transparent = true;
        mat.opacity = 0.22;
        mat.depthWrite = false;
      } else {
        mat.transparent = mat._phOrig.transparent;
        mat.opacity = mat._phOrig.opacity;
        mat.depthWrite = mat._phOrig.depthWrite;
      }
      mat.needsUpdate = true;
    });
  }

  function applyVisibility(next) {
    if (!modelRoot) return;
    modelRoot.traverse(function (obj) {
      if (!obj.isMesh) return;
      var name = obj.name || "";
      obj.visible = figureMeshVisible(name, next);
      if (prefixIndex(name, "Outfit_") >= 0) {
        applyOutfitFade(obj, !!next.revealBody && obj.visible);
      }
    });
  }

  function tintLook(next) {
    var age = clamp01(next.age);
    var white = new THREE.Color(0xffffff);
    var skin = hexColor(SKIN_COLORS[next.skinTone] || SKIN_COLORS[1]);
    skin.lerp(white, 0.08);
    skinMats.forEach(function (mat) {
      mat.color.copy(skin);
      mat.roughness = 0.46 + age * 0.08;
      mat.needsUpdate = true;
    });
    var head = skin.clone();
    headMats.forEach(function (mat) {
      mat.color.copy(head);
      mat.roughness = 0.42 + age * 0.06;
      mat.needsUpdate = true;
    });
    var hair = hexColor(HAIR_COLORS[next.hairColor] || HAIR_COLORS[0]);
    hairMats.forEach(function (mat) {
      mat.color.copy(hair);
      mat.roughness = 0.42 + age * 0.12;
      mat.needsUpdate = true;
    });
    var iris = hexColor(EYE_COLORS[next.eyeColor] || EYE_COLORS[0]);
    var irisSize = 0.82 + clamp01(next.eyeSize) * 0.28;
    eyeMats.forEach(function (mat) {
      mat.color.setRGB(1, 1, 1);
      mat.userData.irisSize = irisSize;
      if (mat.userData.irisColor) mat.userData.irisColor.copy(iris);
      if (mat.userData.shader && mat.userData.shader.uniforms) {
        if (mat.userData.shader.uniforms.irisColor) mat.userData.shader.uniforms.irisColor.value.copy(iris);
        if (mat.userData.shader.uniforms.irisSize) mat.userData.shader.uniforms.irisSize.value = irisSize;
      }
      mat.roughness = 0.28;
      mat.metalness = 0;
      mat.needsUpdate = true;
    });
  }

  function canvasTexture(draw, size) {
    var c = document.createElement("canvas");
    c.width = c.height = size || 256;
    draw(c.getContext("2d"), c.width);
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    tex.needsUpdate = true;
    return tex;
  }

  function makeEnvMap() {
    if (!THREE.PMREMGenerator) return null;
    var envScene = new THREE.Scene();
    var sky = new THREE.Mesh(
      new THREE.SphereGeometry(12, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0xcbbdd8, side: THREE.BackSide })
    );
    envScene.add(sky);
    var floor = new THREE.Mesh(
      new THREE.CylinderGeometry(12, 12, 0.2, 24),
      new THREE.MeshBasicMaterial({ color: 0x2a2038 })
    );
    floor.position.y = -4;
    envScene.add(floor);
    var warm = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0xffd8b8 })
    );
    warm.position.set(4, 6, 3);
    envScene.add(warm);
    var pmrem = new THREE.PMREMGenerator(renderer);
    var rt = pmrem.fromScene(envScene, 0.06);
    pmrem.dispose();
    return rt.texture;
  }

  function injectSkinWrap(mat, amount) {
    var wrap = amount == null ? 0.22 : amount;
    mat.customProgramCacheKey = function () { return "skinwrap-" + String(wrap); };
    mat.onBeforeCompile = function (shader) {
      var extra = "";
      if (wrap < 0.1) {
        extra = [
          "vec2 fu = vUv;",
          "float lip = 1.0 - smoothstep(0.12, 1.0, length((fu - vec2(0.126, 0.162)) / vec2(0.028, 0.0085)));",
          "float lipLine = 1.0 - smoothstep(0.18, 1.0, length((fu - vec2(0.126, 0.160)) / vec2(0.022, 0.0028)));",
          "diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.70, 0.26, 0.30), lip * 0.62);",
          "diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.38, 0.12, 0.14), lipLine * 0.48);",
          "float bL = 1.0 - smoothstep(0.36, 1.0, length((fu - vec2(0.095, 0.090)) / vec2(0.024, 0.0065)));",
          "float bR = 1.0 - smoothstep(0.36, 1.0, length((fu - vec2(0.157, 0.090)) / vec2(0.024, 0.0065)));",
          "diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.09, 0.05, 0.04), max(bL, bR) * 0.92);",
          "float cL = 1.0 - smoothstep(0.35, 1.0, length((fu - vec2(0.080, 0.155)) / vec2(0.018, 0.014)));",
          "float cR = 1.0 - smoothstep(0.35, 1.0, length((fu - vec2(0.172, 0.155)) / vec2(0.018, 0.014)));",
          "diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.86, 0.50, 0.48), max(cL, cR) * 0.12);"
        ].join("\n") + "\n";
      }
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <map_fragment>",
        "#include <map_fragment>\n" + extra
      );
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <output_fragment>",
        [
          "outgoingLight += vec3(0.26, 0.08, 0.05) * (1.0 - pow(max(dot(normal, vec3(0.15, 0.35, 0.92)), 0.0), 1.35)) * " + wrap.toFixed(3) + ";",
          "#include <output_fragment>"
        ].join("\n")
      );
    };
  }

  function upgradeSkinMat(oldMat, envMap, wrapAmount) {
    var mat = new THREE.MeshPhysicalMaterial();
    if (oldMat && oldMat.map) mat.map = oldMat.map;
    if (oldMat && oldMat.normalMap) {
      mat.normalMap = oldMat.normalMap;
      mat.normalScale = new THREE.Vector2(0.9, 0.9);
    }
    if (oldMat && oldMat.color) mat.color.copy(oldMat.color);
    mat.roughness = 0.46;
    mat.metalness = 0;
    mat.clearcoat = 0.12;
    mat.clearcoatRoughness = 0.62;
    mat.envMapIntensity = 0.2;
    mat.morphTargets = true;
    mat.skinning = true;
    if (envMap) mat.envMap = envMap;
    if (mat.sheen && mat.sheen.isColor) mat.sheen.setRGB(0.32, 0.12, 0.08);
    injectSkinWrap(mat, wrapAmount);
    return mat;
  }

  // Eye shape and gaze, measured on bozo-male.glb (Eyes_0 is two 22.2mm
  // spheres centred on the eyeRoot_l/r bones; the iris axis is the bone's
  // local +Z). The eyeball shader works in normalised UV units: `p` below is
  // (uv - centre) / 0.061, and d = 1.0 is the equator, so an angle from the
  // iris axis of about 90deg * d. At rest the lids uncover -32deg..+24deg
  // vertically and -36deg (nose) .. +59deg (temple) horizontally, i.e. a
  // 0.35 / 0.26 tall and 0.40 / 0.66 wide aperture in these units.
  //
  // TestFlight 1.2 (11) shipped irisR 0.58: edge to edge, clipped top and
  // bottom. 1.2 (12) shipped 0.40 / pupil 0.17: still spanned the whole
  // aperture (36deg radius against a 56deg opening) with a black disc for a
  // pupil, under lids that were still wide open, eyes parallel (wall-eyed
  // from 1.7m) and aimed above the camera - "恐怖". The fix is three-part:
  // drop the upper lid (UPPER_LID_DROP), converge both eyes on the camera
  // (aimEyes, so the iris also settles onto the lower lid and there is no
  // lower white), and paint a smaller iris with a pupil that keeps ~37% of
  // it. tintLook scales both radii by irisSize, 0.82..1.10 from the Eyes
  // slider, so the iris stays between 0.25 and 0.34 (23deg..31deg).
  var IRIS_RADIUS = 0.31;
  var PUPIL_RADIUS = 0.115;
  var UPPER_LID_DROP = 0.20;
  // Gaze is clamped to this many radians off the rest axis per eye, enough
  // for the bust (6.6deg down) and full (9.4deg down) cameras plus
  // convergence, not enough to roll the eye into the socket wall.
  var MAX_GAZE_ANGLE = 0.24;

  // GLSL appended after map_fragment: paints sclera, iris, pupil and limbal
  // ring onto the Eyes_0 UVs, shades the eyeball under the upper lid so it
  // sits in the socket instead of glowing, and puts one catchlight per eye
  // at the same screen position (view-space normal, so both eyes match and
  // it follows the gaze). Everything but the sclera is sized from irisR.
  function irisFragmentChunk() {
    return [
      "#include <map_fragment>",
      "vec2 c = vec2(0.5623, 0.4378);",
      "vec2 p = (vUv - c) / vec2(0.061, 0.061);",
      "float d = length(p);",
      "float irisR = " + IRIS_RADIUS.toFixed(3) + " * irisSize;",
      "float pupilR = " + PUPIL_RADIUS.toFixed(3) + " * irisSize;",
      "float irisM = 1.0 - smoothstep(irisR - 0.012, irisR + 0.03, d);",
      "float pupilM = 1.0 - smoothstep(pupilR - 0.01, pupilR + 0.03, d);",
      // Off-white sclera, warmer toward the corners of the eye.
      "vec3 scleraCol = mix(vec3(0.92, 0.905, 0.88), vec3(0.975, 0.965, 0.95), 1.0 - smoothstep(0.30, 0.85, d));",
      // Upper-lid shadow: darkens the top of the eyeball (p.y is up) so the
      // eye reads as recessed under the lid rather than a bright doll bead.
      "float lidShade = smoothstep(-0.12, 0.30, p.y) * 0.26;",
      "scleraCol *= 1.0 - lidShade;",
      // Iris keeps the eye colour's hue: lighter around the pupil, darker
      // toward the limbal ring.
      "float irisT = clamp(d / irisR, 0.0, 1.0);",
      "vec3 irisCol = mix(irisColor * 1.55 + vec3(0.10, 0.07, 0.04), irisColor * 0.72, smoothstep(0.22, 1.0, irisT));",
      "irisCol *= 1.0 - lidShade * 0.8;",
      "float rim = smoothstep(irisR * 0.78, irisR, d) * irisM;",
      "irisCol = mix(irisCol, irisColor * 0.30, rim * 0.72);",
      "vec3 pupilCol = vec3(0.05, 0.04, 0.04);",
      "vec3 col = mix(scleraCol, irisCol, irisM);",
      "col = mix(col, pupilCol, pupilM);",
      // Catchlights from a fixed view-space direction (upper right on
      // screen), identical on both eyes.
      "vec3 vn = normalize(vNormal);",
      "float spec = smoothstep(0.977, 0.992, dot(vn, normalize(vec3(0.20, 0.16, 1.0))));",
      "float spec2 = smoothstep(0.993, 0.998, dot(vn, normalize(vec3(-0.22, -0.26, 1.0))));",
      "col = mix(col, vec3(1.0), spec * 0.92);",
      "col = mix(col, vec3(1.0), spec2 * 0.18);",
      "diffuseColor.rgb = col;",
      // The eyeball faces the dark purple ground of the hemisphere light, so
      // lift it a little unlit (more on the sclera) instead of letting the
      // lower white go steel grey.
      "totalEmissiveRadiance += col * (0.10 + 0.16 * (1.0 - irisM));"
    ].join("\n");
  }

  function upgradeIrisMat(oldMat, envMap) {
    var mat = new THREE.MeshPhysicalMaterial();
    if (oldMat && oldMat.map) mat.map = oldMat.map;
    mat.color.setRGB(1, 1, 1);
    mat.roughness = 0.3;
    mat.metalness = 0;
    mat.clearcoat = 0.45;
    mat.clearcoatRoughness = 0.2;
    // The lavender sky in makeEnvMap tinted the sclera blue-grey; keep just
    // enough reflection for a wet look.
    mat.envMapIntensity = 0.05;
    mat.morphTargets = true;
    mat.skinning = true;
    // Head_0 carries a skin-textured copy of both eyeballs (dished to ~0.7 r
    // at the iris, flush with the sphere at the rim); pull the real eyeball
    // forward in depth so the copy cannot z-fight skin speckles across it.
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -2;
    mat.polygonOffsetUnits = -4;
    if (envMap) mat.envMap = envMap;
    mat.userData.irisColor = new THREE.Color(0x2e4d7a);
    mat.userData.irisSize = 1.0;
    mat.onBeforeCompile = function (shader) {
      shader.uniforms.irisColor = { value: mat.userData.irisColor };
      shader.uniforms.irisSize = { value: mat.userData.irisSize };
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <common>",
        "#include <common>\nuniform vec3 irisColor;\nuniform float irisSize;"
      );
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <map_fragment>",
        irisFragmentChunk()
      );
      mat.userData.shader = shader;
    };
    return mat;
  }

  function addGroundContact() {
    var tex = canvasTexture(function (ctx, size) {
      var g = ctx.createRadialGradient(size / 2, size / 2, 4, size / 2, size / 2, size / 2);
      g.addColorStop(0, "rgba(8,4,16,0.45)");
      g.addColorStop(1, "rgba(8,4,16,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
    }, 128);
    tex.encoding = THREE.LinearEncoding;
    var mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(0.95, 0.48),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
    );
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = 0.008;
    scene.add(mesh);
  }

  var _poseParentQ = new THREE.Quaternion();
  var _poseWorld = new THREE.Quaternion();
  var _poseDelta = new THREE.Quaternion();
  var _axisZ = new THREE.Vector3(0, 0, 1);
  var _ikS = new THREE.Vector3();
  var _ikW = new THREE.Vector3();
  var _ikE = new THREE.Vector3();
  var _ikD = new THREE.Vector3();
  var _ikP = new THREE.Vector3();
  var _aimA = new THREE.Vector3();
  var _aimB = new THREE.Vector3();
  var _aimCur = new THREE.Vector3();
  var _aimTgt = new THREE.Vector3();

  // clavicle / upperarm / lowerarm / hand (not twist helpers, not fingers).
  function isPoseArmBone(name) {
    var bn = (name || "").toLowerCase();
    if (bn.indexOf("twist") >= 0) return false;
    if (bn.indexOf("upperarm") >= 0 || bn.indexOf("lowerarm") >= 0) return true;
    if (bn.indexOf("clavicle") >= 0 || bn.indexOf("shoulder") >= 0) return true;
    if (bn.indexOf("hand") < 0) return false;
    return (
      bn.indexOf("thumb") < 0 &&
      bn.indexOf("index") < 0 &&
      bn.indexOf("middle") < 0 &&
      bn.indexOf("ring") < 0 &&
      bn.indexOf("pinky") < 0 &&
      bn.indexOf("metacarpal") < 0
    );
  }

  function resetArmBones() {
    var i;
    for (i = 0; i < armBones.length; i++) {
      var rest = armRests[i];
      armBones[i].quaternion.set(rest.qx, rest.qy, rest.qz, rest.qw);
    }
  }

  // Multiply the bone's world orientation by `delta` (a world-space rotation).
  function rotateBoneWorldQ(bone, delta) {
    if (!bone) return;
    if (bone.parent) {
      bone.parent.getWorldQuaternion(_poseParentQ);
    } else {
      _poseParentQ.identity();
    }
    _poseWorld.copy(_poseParentQ).multiply(bone.quaternion);
    _poseWorld.premultiply(delta);
    _poseParentQ.invert();
    bone.quaternion.copy(_poseParentQ).multiply(_poseWorld);
    bone.updateMatrixWorld(true);
  }

  function rotateBoneWorld(bone, axis, angle) {
    if (!bone || !angle) return;
    _poseDelta.setFromAxisAngle(axis, angle);
    rotateBoneWorldQ(bone, _poseDelta);
  }

  var _gazeFull = new THREE.Quaternion();
  var _gazeStep = new THREE.Quaternion();
  var _gazeQ = new THREE.Quaternion();
  var _gazePos = new THREE.Vector3();
  var _gazeFwd = new THREE.Vector3();
  var _gazeWant = new THREE.Vector3();

  // Point `bone`'s local +Z (the iris axis of eyeRoot_l/r in bozo-male.glb)
  // at `target` (world space), starting from its rest orientation `rest` and
  // turning at most `maxAngle` radians. Returns the angle actually turned.
  function aimBoneAt(bone, rest, target, maxAngle) {
    if (!bone || !rest || !target) return 0;
    bone.quaternion.copy(rest);
    bone.updateWorldMatrix(true, false);
    bone.getWorldPosition(_gazePos);
    _gazeWant.subVectors(target, _gazePos);
    if (_gazeWant.lengthSq() < 1e-8) return 0;
    _gazeWant.normalize();
    bone.getWorldQuaternion(_gazeQ);
    _gazeFwd.set(0, 0, 1).applyQuaternion(_gazeQ).normalize();
    _gazeFull.setFromUnitVectors(_gazeFwd, _gazeWant);
    _gazeStep.identity();
    _gazeStep.rotateTowards(_gazeFull, maxAngle);
    rotateBoneWorldQ(bone, _gazeStep);
    return Math.min(maxAngle, _gazeFwd.angleTo(_gazeWant));
  }

  // Both eyes converge on the camera every frame (after the idle head sway),
  // so the irises meet the viewer instead of staring parallel past them.
  function aimEyes(target) {
    var i;
    for (i = 0; i < eyeBones.length; i++) {
      aimBoneAt(eyeBones[i], eyeRests[i], target, MAX_GAZE_ANGLE);
    }
  }

  // Turn `bone` so the segment bone -> child points along `dir` (world space).
  function aimBone(bone, child, dir) {
    if (!bone || !child) return;
    bone.getWorldPosition(_aimA);
    child.getWorldPosition(_aimB);
    _aimCur.subVectors(_aimB, _aimA);
    if (_aimCur.lengthSq() < 1e-10) return;
    _aimCur.normalize();
    _aimTgt.set(dir[0], dir[1], dir[2]).normalize();
    _poseDelta.setFromUnitVectors(_aimCur, _aimTgt);
    rotateBoneWorldQ(bone, _poseDelta);
  }

  // Two-bone IK: elbow position for shoulder S, wrist target W, segment
  // lengths L1/L2, with the elbow pushed toward `pole`.
  function solveElbow(S, W, L1, L2, pole, out) {
    _ikD.subVectors(W, S);
    var dist = _ikD.length();
    var maxReach = L1 + L2 - 0.005;
    var minReach = Math.abs(L1 - L2) + 0.005;
    dist = Math.max(minReach, Math.min(maxReach, dist));
    _ikD.normalize();
    var a = (L1 * L1 - L2 * L2 + dist * dist) / (2 * dist);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    _ikP.set(pole[0], pole[1], pole[2]);
    _ikP.addScaledVector(_ikD, -_ikP.dot(_ikD));
    if (_ikP.lengthSq() < 1e-8) {
      _ikP.set(0, 0, -1);
      _ikP.addScaledVector(_ikD, -_ikP.dot(_ikD));
    }
    _ikP.normalize();
    out.copy(S).addScaledVector(_ikD, a).addScaledVector(_ikP, h);
    return out;
  }

  function sideBone(base, side) {
    return masterBones[base + "_" + side] || null;
  }

  // Pose one arm. `t` is authored for the LEFT side (+X = the character's
  // left) as offsets from the shoulder joint; the right side mirrors X.
  function poseArm(side, t) {
    var upper = sideBone("upperarm", side);
    var lower = sideBone("lowerarm", side);
    var hand = sideBone("hand", side);
    var finger = sideBone("middle_01", side) || sideBone("middle_metacarpal", side);
    if (!upper || !lower || !hand) return;
    var m = side === "r" ? -1 : 1;
    if (t.clavicleLift && sideBone("clavicle", side)) {
      rotateBoneWorld(sideBone("clavicle", side), _axisZ, m * t.clavicleLift);
      upper.updateMatrixWorld(true);
    }
    upper.getWorldPosition(_ikS);
    lower.getWorldPosition(_ikE);
    var L1 = _ikE.distanceTo(_ikS);
    hand.getWorldPosition(_ikW);
    var L2 = _ikW.distanceTo(_ikE);
    _ikW.set(_ikS.x + m * t.wrist[0], _ikS.y + t.wrist[1], _ikS.z + t.wrist[2]);
    solveElbow(_ikS, _ikW, L1, L2, [m * t.pole[0], t.pole[1], t.pole[2]], _ikE);
    aimBone(upper, lower, [_ikE.x - _ikS.x, _ikE.y - _ikS.y, _ikE.z - _ikS.z]);
    lower.getWorldPosition(_ikE);
    aimBone(lower, hand, [_ikW.x - _ikE.x, _ikW.y - _ikE.y, _ikW.z - _ikE.z]);
    if (finger && t.hand) {
      aimBone(hand, finger, [m * t.hand[0], t.hand[1], t.hand[2]]);
    }
  }

  // Wrist offsets are metres from the shoulder joint on a 1.8m figure:
  // +x outward, +y up, +z toward the camera. Rest is an A-pose with the
  // wrist at about (+0.29, -0.37, +0.09).
  var ARM_RELAXED = {
    wrist: [0.10, -0.42, 0.09],
    pole: [0.6, 0, -0.8],
    hand: [0.05, -0.95, 0.3]
  };
  var OUTFIT_POSES = [
    // 0 Shirt + jeans: relaxed, arms hanging beside the thighs.
    { l: ARM_RELAXED, r: ARM_RELAXED },
    // 1 Jacket: arms folded across the chest, right forearm over the left.
    {
      l: { wrist: [-0.11, -0.24, 0.23], pole: [0.55, -0.8, 0.25], hand: [-0.72, 0.22, -0.25] },
      r: { wrist: [-0.10, -0.16, 0.29], pole: [0.55, -0.8, 0.25], hand: [-0.72, 0.18, -0.30] }
    },
    // 2 Hoodie: hands on hips, elbows out.
    {
      l: { wrist: [0.085, -0.35, 0.10], pole: [1, 0.15, -0.35], hand: [-0.3, -0.6, 0.74] },
      r: { wrist: [0.085, -0.35, 0.10], pole: [1, 0.15, -0.35], hand: [-0.3, -0.6, 0.74] }
    },
    // 3 Tank top: left arm relaxed, right hand raised in a wave.
    {
      l: { wrist: [0.11, -0.41, 0.07], pole: [0.6, 0, -0.8], hand: [0.05, -0.95, 0.3] },
      r: { wrist: [0.25, 0.12, 0.13], pole: [0.9, -0.45, 0], hand: [-0.1, 0.95, 0.25], clavicleLift: 0.1 }
    }
  ];

  function applyOutfitPose(outfitIndex) {
    if (!armBones.length) return;
    resetArmBones();
    if (modelRoot) modelRoot.updateMatrixWorld(true);
    var pose = OUTFIT_POSES[outfitIndex | 0] || OUTFIT_POSES[0];
    poseArm("l", pose.l);
    poseArm("r", pose.r || pose.l);
    if (modelRoot) modelRoot.updateMatrixWorld(true);
  }

  function applyLook(next) {
    look = Object.assign(look, next || {});
    if (!ready) { pendingLook = look; return; }
    applyVisibility(look);
    applyOutfitPose(look.appearanceIndex | 0);
    morphMeshes.forEach(function (mesh) { applyMeshLook(mesh, look); });
    tintLook(look);
    frameCamera(look.viewMode === "bust" ? "bust" : "full");
  }

  function cameraDistance(coverHeight, fov) {
    var half = (fov * Math.PI / 180) * 0.5;
    return (coverHeight * 0.5) / Math.tan(half);
  }

  function frameCamera(mode) {
    if (!camera) return;
    var h = modelHeight;
    if (mode === "bust") {
      camera.fov = 28;
      camera.position.set(h * 0.05, h * 0.82, cameraDistance(h * 0.48, camera.fov));
      camera.lookAt(0, h * 0.8, 0);
    } else {
      camera.fov = 26;
      camera.position.set(h * 0.06, h * 0.5, cameraDistance(h * 1.18, camera.fov));
      camera.lookAt(0, h * 0.5, 0);
    }
    camera.updateProjectionMatrix();
  }

  function resize() {
    if (!renderer || !camera) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
    camera.updateProjectionMatrix();
  }

  function animate() {
    requestAnimationFrame(animate);
    clock += 0.016;
    if (modelRoot) {
      var breathe = Math.sin(clock * 1.25);
      var shift = Math.sin(clock * 0.48);
      modelRoot.rotation.y = shift * 0.038;
      modelRoot.rotation.z = Math.sin(clock * 0.37) * 0.014;
      modelRoot.position.y = modelRestY + breathe * 0.01;
      var sy = 1 + breathe * 0.007;
      modelRoot.scale.set(1 / Math.sqrt(sy), sy, 1 / Math.sqrt(sy));
    }
    var i;
    for (i = 0; i < headBones.length; i++) {
      headBones[i].rotation.x = headRests[i].x + Math.sin(clock * 0.9) * 0.012;
      headBones[i].rotation.y = headRests[i].y + Math.sin(clock * 0.45) * 0.035;
    }
    if (camera) aimEyes(camera.position);
    renderer.render(scene, camera);
  }

  function fail(err) {
    var message = "load";
    if (err && err.message) message = err.message;
    else if (err && err.type) message = err.type + " " + (err.target && err.target.status);
    else message = String(err || "load");
    setStatus("");
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage("error:" + message);
  }

  if (!window.THREE || !THREE.GLTFLoader) {
    fail(new Error("Three.js failed to load"));
  } else {
    var canvas = document.getElementById("c");
    try {
      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: false,
        powerPreference: "high-performance"
      });
    } catch (err) {
      fail(err);
    }
    if (!renderer) {
      fail(new Error("WebGL renderer missing"));
    } else {
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.LinearToneMapping;
    renderer.toneMappingExposure = 1.12;
    if ("physicallyCorrectLights" in renderer) renderer.physicallyCorrectLights = true;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(24, 1, 0.05, 40);
    var envMap = makeEnvMap();
    scene.add(new THREE.HemisphereLight(0xffefe4, 0x2a2036, 0.62));
    var key = new THREE.DirectionalLight(0xffe6d2, 1.25);
    key.position.set(0.7, 1.9, 1.5);
    scene.add(key);
    var fill = new THREE.DirectionalLight(0x9eb0d4, 0.4);
    fill.position.set(-1.4, 0.6, 0.5);
    scene.add(fill);
    var rim = new THREE.DirectionalLight(0xffc4d8, 0.7);
    rim.position.set(0.1, 1.2, -1.7);
    scene.add(rim);
    addGroundContact();
    resize();
    window.addEventListener("resize", resize);

    new THREE.GLTFLoader().load(
      "bozo-male.glb?v=bozo24",
      function (gltf) {
        try {
          modelRoot = gltf.scene;
          retargetSkeletons(modelRoot);
          Object.keys(masterBones).forEach(function (boneName) {
            var bone = masterBones[boneName];
            if (boneName === "head") {
              headBones.push(bone);
              headRests.push({
                x: bone.rotation.x,
                y: bone.rotation.y,
                z: bone.rotation.z
              });
            }
            if (boneName === "eyeRoot_l" || boneName === "eyeRoot_r") {
              eyeBones.push(bone);
              eyeRests.push(bone.quaternion.clone());
            }
            if (isPoseArmBone(boneName)) armBones.push(bone);
          });
          modelRoot.traverse(function (obj) {
            if (!obj.isMesh) return;
            obj.frustumCulled = !obj.isSkinnedMesh;
            var name = obj.name || "";
            if (name.indexOf("Icosphere") === 0) {
              obj.visible = false;
              return;
            }
            var skinned = !!obj.isSkinnedMesh;
            materialsOf(obj).forEach(function (mat, matIdx) {
              if (!mat || typeof mat !== "object") return;
              var matLabel = mat.name || "";
              var swapped = null;
              if (matLabel.indexOf("MAT_SkinHead") === 0) {
                swapped = upgradeSkinMat(mat, envMap, 0.07);
                swapped.color.copy(hexColor(SKIN_COLORS[1]));
                swapped.skinning = skinned;
                headMats.push(swapped);
              } else if (matLabel.indexOf("MAT_Skin") === 0) {
                swapped = upgradeSkinMat(mat, envMap, 0.18);
                swapped.skinning = skinned;
                skinMats.push(swapped);
              } else if (matLabel.indexOf("MAT_Hair") === 0) {
                mat.skinning = skinned;
                mat.morphTargets = !!obj.morphTargetInfluences;
                mat.roughness = 0.42;
                mat.metalness = 0.04;
                mat.transparent = true;
                mat.alphaTest = 0.35;
                mat.side = THREE.DoubleSide;
                if (envMap) mat.envMap = envMap;
                mat.envMapIntensity = 0.08;
                hairMats.push(mat);
              } else if (matLabel.indexOf("MAT_Iris") === 0) {
                swapped = upgradeIrisMat(mat, envMap);
                swapped.skinning = skinned;
                eyeMats.push(swapped);
              } else {
                mat.skinning = skinned;
                mat.morphTargets = !!obj.morphTargetInfluences;
                if (envMap) {
                  mat.envMap = envMap;
                  mat.envMapIntensity = 0.12;
                }
              }
              if (swapped) {
                if (Array.isArray(obj.material)) obj.material[matIdx] = swapped;
                else obj.material = swapped;
              }
            });
            if (skinned) {
              materialsOf(obj).forEach(function (mat) {
                if (mat && typeof mat === "object") mat.skinning = true;
              });
            }
            if (name.indexOf("Eyes_") === 0) {
              obj.renderOrder = 2;
            }
            if (obj.morphTargetInfluences && obj.morphTargetDictionary) {
              pruneToShapes(obj);
              if (obj.morphTargetInfluences.length) morphMeshes.push(obj);
            }
          });
          armBones.sort(function (a, b) {
            function depth(node) {
              var d = 0;
              while (node && node.parent) { d += 1; node = node.parent; }
              return d;
            }
            return depth(a) - depth(b);
          });
          armRests = armBones.map(function (bone) {
            return {
              x: bone.rotation.x,
              y: bone.rotation.y,
              z: bone.rotation.z,
              qx: bone.quaternion.x,
              qy: bone.quaternion.y,
              qz: bone.quaternion.z,
              qw: bone.quaternion.w
            };
          });
          applyVisibility(look);
          scene.add(modelRoot);
          placeFigure();
          ready = true;
          setStatus("");
          try {
            applyLook(pendingLook || look);
          } catch (lookErr) {
            fail(lookErr);
            return;
          }
          if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage("ready");
          animate();
        } catch (err) {
          fail(err);
        }
      },
      function (evt) {
      },
      fail
    );
    }
  }

  // Read-only probe for scripts/check-avatar-viewer.js and tests. Reports the
  // rig state and the world-space boxes of the visible figure meshes.
  function boxOf(box) {
    if (!box || box.isEmpty()) return null;
    return {
      min: [box.min.x, box.min.y, box.min.z],
      max: [box.max.x, box.max.y, box.max.z]
    };
  }

  function boxToFrame(box) {
    if (!box || !camera) return null;
    var v = new THREE.Vector3();
    var out = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
    var i;
    for (i = 0; i < 8; i++) {
      v.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z);
      v.project(camera);
      out.minX = Math.min(out.minX, v.x);
      out.maxX = Math.max(out.maxX, v.x);
      out.minY = Math.min(out.minY, v.y);
      out.maxY = Math.max(out.maxY, v.y);
    }
    return out;
  }

  window.phViewerState = function () {
    var meshes = {};
    var visible = [];
    if (modelRoot) {
      modelRoot.updateMatrixWorld(true);
      modelRoot.traverse(function (obj) {
        if (!obj.isMesh || !isFigureMesh(obj.name || "")) return;
        var box = measureFigureBox(new THREE.Box3(), function (n) { return n === obj.name; }, true);
        meshes[obj.name] = {
          visible: !!obj.visible,
          skinned: !!obj.isSkinnedMesh,
          box: boxOf(box),
          frame: obj.visible ? boxToFrame(box) : null
        };
        if (obj.visible) visible.push(obj.name);
      });
    }
    var figure = measureFigureBox(new THREE.Box3());
    return {
      ready: ready,
      look: look,
      modelHeight: modelHeight,
      masterBoneCount: Object.keys(masterBones).length,
      armBoneCount: armBones.length,
      armBones: armBones.map(function (b) { return rigName(b); }),
      figure: boxOf(figure),
      figureFrame: boxToFrame(figure),
      camera: camera ? { fov: camera.fov, position: [camera.position.x, camera.position.y, camera.position.z] } : null,
      eyes: eyeState(),
      visible: visible,
      meshes: meshes
    };
  };

  // Gaze and lid state: where each eyeball sits, where its iris axis points,
  // how far that is from the camera, and the Head_0 upper-lid morph weight.
  function eyeState() {
    var out = { lidDrop: null, gaze: {} };
    morphMeshes.forEach(function (mesh) {
      if ((mesh.name || "").indexOf("Head_") !== 0) return;
      var idx = mesh.morphTargetDictionary["Shape_EyeLidHeight"];
      if (typeof idx === "number") out.lidDrop = mesh.morphTargetInfluences[idx];
    });
    var pos = new THREE.Vector3();
    var fwd = new THREE.Vector3();
    var toCam = new THREE.Vector3();
    var q = new THREE.Quaternion();
    eyeBones.forEach(function (bone) {
      bone.updateWorldMatrix(true, false);
      bone.getWorldPosition(pos);
      bone.getWorldQuaternion(q);
      fwd.set(0, 0, 1).applyQuaternion(q).normalize();
      var entry = {
        position: [pos.x, pos.y, pos.z],
        forward: [fwd.x, fwd.y, fwd.z],
        offCameraDeg: null
      };
      if (camera) {
        toCam.subVectors(camera.position, pos).normalize();
        entry.offCameraDeg = (fwd.angleTo(toCam) * 180) / Math.PI;
      }
      out.gaze[rigName(bone)] = entry;
    });
    return out;
  }

  // Pure rig logic, exposed so __tests__/avatar-viewer-rig.test.ts can run
  // this exact script under Node with the bundled three.min.js.
  window.phViewerRig = {
    SKIN_BY_OUTFIT: SKIN_BY_OUTFIT,
    OUTFIT_POSES: OUTFIT_POSES,
    MIN_PLAUSIBLE_HEIGHT: MIN_PLAUSIBLE_HEIGHT,
    FALLBACK_HEIGHT: FALLBACK_HEIGHT,
    IRIS_RADIUS: IRIS_RADIUS,
    PUPIL_RADIUS: PUPIL_RADIUS,
    UPPER_LID_DROP: UPPER_LID_DROP,
    MAX_GAZE_ANGLE: MAX_GAZE_ANGLE,
    upperLidDrop: upperLidDrop,
    aimBoneAt: aimBoneAt,
    irisFragmentChunk: irisFragmentChunk,
    figureMeshVisible: figureMeshVisible,
    nameHasExposedSkin: nameHasExposedSkin,
    isFigureMesh: isFigureMesh,
    isPoseArmBone: isPoseArmBone,
    figureHeight: figureHeight,
    sampleMeshPoint: sampleMeshPoint,
    rigName: rigName,
    retargetSkeletons: retargetSkeletons,
    masterBoneNames: function () { return Object.keys(masterBones); },
    solveElbow: solveElbow
  };

  window.applyLook = applyLook;
})();
</script>
