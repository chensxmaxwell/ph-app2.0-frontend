    rotateBoneWorld(kneeIdle.calf, _axisX, swing);
    rotateBoneWorld(kneeIdle.foot, _axisX, -swing / 2);
  }

  // Wrist offsets are metres from the shoulder joint on a 1.8m figure:
  // +x outward, +y up, +z toward the camera. Rest is an A-pose with the
  // wrist at about (+0.29, -0.37, +0.09). `hand` aims the hand bone at the
  // middle finger, `curl` (0-1) softens the fingers (poseFingers),
  // `clavicleLift` (radians) raises the shoulder for a lifted arm.
  //
  // Body Style C (2026-09-07): the #42 table read as a soldier stand (both
  // arms identical, hands flat), a death-hug (arms folded hard across the
  // chest) and a symmetric power pose (hands on hips, elbows out). Every
  // pose is now asymmetric and soft: the elbow poles hang back and down
  // instead of flaring, wrists sit a few centimetres apart between sides,
  // hands are aimed a little forward and curled, and nothing crosses the
  // chest. The left arm is on the weight side of STANCE (that shoulder is
  // lower, that hip out), so its hand hangs closer and lower.
  var ARM_HANG_L = {
    wrist: [0.06, -0.43, 0.10],
    pole: [0.25, -0.25, -0.93],
    hand: [0.0, -0.93, 0.36],
    curl: 0.35
  };
  var ARM_HANG_R = {
    wrist: [0.075, -0.415, 0.125],
    pole: [0.25, -0.25, -0.93],
    hand: [0.06, -0.9, 0.42],
    curl: 0.5
  };
  var OUTFIT_POSES = [
    // 0 Shirt + jeans: soft asymmetric relax - both arms hang, the wrist
    // offsets 3 cm apart between sides, hands bent a little forward and
    // curled.
    { l: ARM_HANG_L, r: ARM_HANG_R },
    // 1 Jacket: loose drape, light hold - the right arm hangs soft; the left
    // hand comes forward to rest lightly at the belt in front of the hip
    // pocket, back of the hand to the camera (twist), fingers hanging.
    // (A two-hand wrist hold in front of the pelvis was rendered first: in
    // the frontal preview both hands stacked at the crotch and read as
    // hand-wringing, so the hold is one hand at the belt.) Nothing crosses
    // the chest; the belt-hand wrist sits 0.39 m under the shoulder.
    {
      l: { wrist: [-0.02, -0.39, 0.15], pole: [0.7, -0.2, -0.7], hand: [-0.2, -0.85, 0.45], curl: 0.45, twist: 1.0 },
      r: ARM_HANG_R
    },
    // 2 Hoodie: light one-side hip touch - the left hand (weight-side hip,
    // pushed out) rests on the hip rim, fingers forward, the elbow hanging
    // back rather than flaring; the right arm hangs soft.
    {
      l: { wrist: [0.06, -0.385, 0.085], pole: [0.5, -0.3, -0.8], hand: [-0.15, -0.45, 0.88], curl: 0.3 },
      r: { wrist: [0.07, -0.42, 0.125], pole: [0.25, -0.25, -0.93], hand: [0.06, -0.92, 0.38], curl: 0.45 }
    },
    // 3 Tank top: left arm hangs soft, right hand raised in a wave with a
    // small shoulder lift (<= 0.06 rad).
    {
      l: ARM_HANG_L,
      r: { wrist: [0.25, 0.12, 0.13], pole: [0.9, -0.45, 0], hand: [-0.1, 0.95, 0.25], clavicleLift: 0.06, curl: 0.15 }
    }
  ];

  function applyOutfitPose(outfitIndex) {
    if (!armBones.length) return;
    resetArmBones();
    resetFingerBones();

    applyStance(pose.stance || STANCE);

    poseArm("r", pose.r || pose.l);
    poseFingers("l", pose.l.curl);
    poseFingers("r", (pose.r || pose.l).curl);

  }

  // three r128 uploads at most eight morph influences per draw
  // (WebGLMorphtargets keeps the eight largest by |influence|; the vertex
  // shader sums morphTarget0..7). Head_0 carries 24 Shape_* targets and a
  // default look drives eighteen of them, so the weakest were silently
  // dropped - among them the body-shared Shape_NeckThickness and
  // Shape_Weight, which Body_Neck (nine targets, eight active) did apply.
  // Both meshes share the seam ring vertex for vertex, so the ring moved on
  // the neck and not on the head: a ~2 mm gap that showed the page
  // background as a white line round the base of the neck (TF 1.2.21 bust).
  // The morphs are therefore summed here, on the CPU, into the position
  // attribute on every look (skinning stays on the GPU; the GLB has no morph
  // normals, so the shader path never lit them differently either), and no
  // material turns the shader morph path on. Absolute, from a copy of the
  // base positions, so it is idempotent; a mesh whose influences did not
  // change is skipped. Returns whether the positions were rewritten.
  function bakeMorphs(mesh) {
    var geo = mesh.geometry;
    var infl = mesh.morphTargetInfluences;

    if (!geo || !infl || !targets || !targets.length || !geo.attributes.position) return false;
    var pos = geo.attributes.position;
    var base = geo.userData.phMorphBase;
    if (!base) {
      base = Float32Array.from(pos.array);
      geo.userData.phMorphBase = base;

    var baked = geo.userData.phMorphBaked;
    var k;
    if (baked && baked.length === infl.length) {
      var same = true;
      for (k = 0; k < infl.length; k++) {
        if (baked[k] !== infl[k]) { same = false; break; }
      }
      if (same) return false;
    }
    var out = pos.array;
    out.set(base);
    var i, w, d;
    for (k = 0; k < targets.length && k < infl.length; k++) {
      w = infl[k];
      if (!w) continue;
      d = targets[k].array;
      for (i = 0; i < out.length; i++) out[i] += w * d[i];
    }
    pos.needsUpdate = true;
    geo.userData.phMorphBaked = Float32Array.from(infl);
    return true;
  }

  // Measured on the GLB, Shape_Stern moves the lid margin up to 10.8 mm and
  // Shape_Sharpness 6.5 mm at weight 1, while Eyes_0 carries neither: with
  // the Jaw / Chin caps at 0.45 / 0.50 the lids would hood over the eyeball
  // as the sliders rise (~2 mm already at the default look) - the eye the
  // Size slider was tuned for.
  // So the sculpt deltas are faded out over each vertex's weight on the eye
  // bones (1.0 on the lid margin and the Head_0 eye cap, fading to 0 by the
  // brow), the same falloff applyEyeScale relies on. Once, at load, after
  // pruneToShapes and before the first bake. Returns whether the mesh has an
  // eye bone to mask against.
  function maskEyeRegion(mesh) {
    var geo = mesh.geometry;
    if (!mesh.isSkinnedMesh || !mesh.skeleton || !geo || !geo.attributes.skinIndex || !geo.attributes.skinWeight) return false;
    if (!mesh.morphTargetDictionary || !geo.morphAttributes || !geo.morphAttributes.position) return false;
    var eyeSlots = {};
    var hasEye = false;
    mesh.skeleton.bones.forEach(function (bone, slot) {
      if (rigName(bone).indexOf("eyeRoot") === 0) { eyeSlots[slot] = true; hasEye = true; }
    });
    if (!hasEye) return false;
    var skinIndex = geo.attributes.skinIndex;
    var skinWeight = geo.attributes.skinWeight;
    var count = geo.attributes.position.count;
    var eyeWeight = new Float32Array(count);
    var i, k, w;
    for (i = 0; i < count; i++) {
      w = 0;
      for (k = 0; k < skinIndex.itemSize; k++) {
        if (eyeSlots[skinIndex.array[i * skinIndex.itemSize + k]]) w += skinWeight.array[i * skinWeight.itemSize + k];
      }
      eyeWeight[i] = Math.min(1, w);
    }
    SCULPT_MORPHS.forEach(function (name) {
      var idx = mesh.morphTargetDictionary[name];
      var source = idx === undefined ? null : geo.morphAttributes.position[idx];
      if (!source) return;
      var masked = Float32Array.from(source.array);
      for (i = 0; i < count; i++) {
        var keep = 1 - eyeWeight[i];
        masked[i * 3] *= keep;
        masked[i * 3 + 1] *= keep;
        masked[i * 3 + 2] *= keep;
      }
      geo.morphAttributes.position[idx] = new THREE.Float32BufferAttribute(masked, 3);
    });
    return true;
  }

  function applyLook(next) {
    look = Object.assign(look, next || {});
    if (!ready) { pendingLook = look; return; }
    applyVisibility(look);
    applyOutfitPose(look.appearanceIndex | 0);
    applyEyeScale(eyeBones, eyeScaleFor(look.eyeSize));
    morphMeshes.forEach(function (mesh) {
      applyMeshLook(mesh, look);
      bakeMorphs(mesh);
    });
    tintLook(look);
    frameCamera(look.viewMode === "bust" ? "bust" : "full");
  }

  function cameraDistance(coverHeight, fov) {
    var half = (fov * Math.PI / 180) * 0.5;
    return (coverHeight * 0.5) / Math.tan(half);
  }

  function frameCamera(mode) {
    if (!camera) return;
    var h = modelHeight;
    if (mode === "bust") {
      camera.fov = 28;
      camera.position.set(h * 0.05, h * 0.82, cameraDistance(h * 0.48, camera.fov));
      camera.lookAt(0, h * 0.8, 0);
    } else {
      camera.fov = 26;
      camera.position.set(h * 0.06, h * 0.5, cameraDistance(h * 1.18, camera.fov));
      camera.lookAt(0, h * 0.5, 0);
    }
    camera.updateProjectionMatrix();
  }

  function resize() {
    if (!renderer || !camera) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
    camera.updateProjectionMatrix();
  }

  function animate() {
    requestAnimationFrame(animate);
    clock += 0.016;
    if (modelRoot) {
      var breathe = Math.sin(clock * 1.25);
      var shift = Math.sin(clock * 0.48);
      modelRoot.rotation.y = shift * 0.038;
      modelRoot.rotation.z = Math.sin(clock * 0.37) * 0.014;
      modelRoot.position.y = modelRestY + breathe * 0.01;
      var sy = 1 + breathe * 0.007;
      modelRoot.scale.set(1 / Math.sqrt(sy), sy, 1 / Math.sqrt(sy));
    }
    var i;
    for (i = 0; i < headBones.length; i++) {
      headBones[i].rotation.x = headRests[i].x + Math.sin(clock * 0.9) * 0.012;
      headBones[i].rotation.y = headRests[i].y + Math.sin(clock * 0.45) * 0.035;
    }
    idleKnee(clock);
    if (camera) aimEyes(camera.position);
    updateEyeCentres();
    updateKeyDirection();
    updateHairUniforms();
    renderer.render(scene, camera);
  }

  function fail(err) {
    var message = "load";
    if (err && err.message) message = err.message;
    else if (err && err.type) message = err.type + " " + (err.target && err.target.status);
    else message = String(err || "load");
    setStatus("");
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage("error:" + message);
  }

  if (!window.THREE || !THREE.GLTFLoader) {
    fail(new Error("Three.js failed to load"));
  } else {
    var canvas = document.getElementById("c");
    try {
      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: false,
        powerPreference: "high-performance"
      });
    } catch (err) {
      fail(err);
    }
    if (!renderer) {
      fail(new Error("WebGL renderer missing"));
    } else {
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.LinearToneMapping;
    renderer.toneMappingExposure = LIGHT_RIG.exposure;
    if ("physicallyCorrectLights" in renderer) renderer.physicallyCorrectLights = true;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(24, 1, 0.05, 40);
    var envMap = makeEnvMap();
    scene.add(new THREE.HemisphereLight(LIGHT_RIG.hemisphere.sky, LIGHT_RIG.hemisphere.ground, LIGHT_RIG.hemisphere.intensity));
    var directional = function (spec) {
      var light = new THREE.DirectionalLight(spec.color, spec.intensity);
      light.position.set(spec.position[0], spec.position[1], spec.position[2]);
      scene.add(light);
      return light;
    };
    directional(LIGHT_RIG.key);
    directional(LIGHT_RIG.fill);
    directional(LIGHT_RIG.rim);
    addGroundContact();
    resize();
    window.addEventListener("resize", resize);

    new THREE.GLTFLoader().load(
      "bozo-male.glb?v=bozo24",
      function (gltf) {
        try {
          modelRoot = gltf.scene;
          retargetSkeletons(modelRoot);
          collectPoseBones();
          Object.keys(masterBones).forEach(function (boneName) {
            var bone = masterBones[boneName];
            if (boneName === "head") {
              headBones.push(bone);
              headRests.push({
                x: bone.rotation.x,
                y: bone.rotation.y,
                z: bone.rotation.z
              });
            }
            if (boneName === "eyeRoot_l" || boneName === "eyeRoot_r") {
              eyeBones.push(bone);
              eyeRests.push(bone.quaternion.clone());
            }
            if (isPoseArmBone(boneName)) armBones.push(bone);
          });
          applyEyeScale(eyeBones, eyeScaleFor(look.eyeSize));
          var hairExtras = [];
          modelRoot.traverse(function (obj) {
            if (!obj.isMesh) return;
            obj.frustumCulled = !obj.isSkinnedMesh;
            var name = obj.name || "";
            if (name.indexOf("Icosphere") === 0) {
              obj.visible = false;
              return;
            }
            var skinned = !!obj.isSkinnedMesh;
            materialsOf(obj).forEach(function (mat, matIdx) {
              if (!mat || typeof mat !== "object") return;
              var matLabel = mat.name || "";
              var swapped = null;
              if (matLabel.indexOf("MAT_SkinHead") === 0) {
                swapped = upgradeSkinMat(mat, envMap, 0.07);
                swapped.color.copy(hexColor(SKIN_COLORS[1]));
                swapped.skinning = skinned;
                swapped.userData.eyeSlots = eyeBoneSlots(obj);
                headMats.push(swapped);
              } else if (matLabel.indexOf("MAT_Skin") === 0) {
                swapped = upgradeSkinMat(mat, envMap, 0.18);
                swapped.skinning = skinned;
                skinMats.push(swapped);
              } else if (matLabel.indexOf("MAT_Hair") === 0) {
                hairExtras = hairExtras.concat(dressHair(obj, envMap));
              } else if (matLabel.indexOf("MAT_Iris") === 0) {
                swapped = upgradeIrisMat(mat, envMap);
                swapped.skinning = skinned;
                eyeMats.push(swapped);
              } else {
                mat.skinning = skinned;
                if (envMap) {
                  mat.envMap = envMap;
                  mat.envMapIntensity = 0.12;
                }
              }
              if (swapped) {
                if (Array.isArray(obj.material)) obj.material[matIdx] = swapped;
                else obj.material = swapped;
              }
            });
            if (skinned) {
              materialsOf(obj).forEach(function (mat) {
                if (mat && typeof mat === "object") mat.skinning = true;
              });
            }
            if (name.indexOf("Eyes_") === 0) {
              obj.renderOrder = 2;
            }
            if (obj.morphTargetInfluences && obj.morphTargetDictionary) {
              pruneToShapes(obj);
              if (obj.morphTargetInfluences.length) {
                maskEyeRegion(obj);
                morphMeshes.push(obj);
              }
            }
          });
          hairExtras.forEach(function (extra) {
            var shellName = extra.name.replace(/_cards_fringe$|_cards$|_fringe$/, "");
            var shell = modelRoot.getObjectByName(shellName);
            (shell && shell.parent ? shell.parent : modelRoot).add(extra);
            extra.frustumCulled = false;
          });
          armBones.sort(function (a, b) {
            function depth(node) {
              var d = 0;
              while (node && node.parent) { d += 1; node = node.parent; }
              return d;
            }
            return depth(a) - depth(b);
          });
          armRests = armBones.map(function (bone) {
            return {
              x: bone.rotation.x,
              y: bone.rotation.y,
              z: bone.rotation.z,
              qx: bone.quaternion.x,
              qy: bone.quaternion.y,
              qz: bone.quaternion.z,
              qw: bone.quaternion.w
            };
          });
          applyVisibility(look);
          scene.add(modelRoot);
          placeFigure();
          ready = true;
          setStatus("");
          try {
            applyLook(pendingLook || look);
          } catch (lookErr) {
            fail(lookErr);
            return;
          }
          if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage("ready");
          animate();
        } catch (err) {
          fail(err);
        }
      },
      function (evt) {
      },
      fail
    );
    }
  }

  // Read-only probe for scripts/check-avatar-viewer.js and tests. Reports the
  // rig state and the world-space boxes of the visible figure meshes.
  function boxOf(box) {
    if (!box || box.isEmpty()) return null;
    return {
      min: [box.min.x, box.min.y, box.min.z],
      max: [box.max.x, box.max.y, box.max.z]
    };
  }

  function boxToFrame(box) {
    if (!box || !camera) return null;
    var v = new THREE.Vector3();
    var out = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
    var i;
    for (i = 0; i < 8; i++) {
      v.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z);
      v.project(camera);
      out.minX = Math.min(out.minX, v.x);
      out.maxX = Math.max(out.maxX, v.x);
      out.minY = Math.min(out.minY, v.y);
      out.maxY = Math.max(out.maxY, v.y);
    }
    return out;
  }

  window.phViewerState = function () {
    var meshes = {};
    var visible = [];
    if (modelRoot) {
      modelRoot.updateMatrixWorld(true);
      modelRoot.traverse(function (obj) {
        if (!obj.isMesh || !isFigureMesh(obj.name || "")) return;
        var box = measureFigureBox(new THREE.Box3(), function (n) { return n === obj.name; }, true);
        meshes[obj.name] = {
          visible: !!obj.visible,
          skinned: !!obj.isSkinnedMesh,
          box: boxOf(box),
          frame: obj.visible ? boxToFrame(box) : null
        };
        if (obj.visible) visible.push(obj.name);
      });
    }
    var figure = measureFigureBox(new THREE.Box3());
    return {
      ready: ready,
      look: look,
      modelHeight: modelHeight,
      masterBoneCount: Object.keys(masterBones).length,
      armBoneCount: armBones.length,
      armBones: armBones.map(function (b) { return rigName(b); }),
      figure: boxOf(figure),
      figureFrame: boxToFrame(figure),
      camera: camera ? { fov: camera.fov, position: [camera.position.x, camera.position.y, camera.position.z] } : null,
      eyes: eyeState(),
      face: faceProfile(),
      stance: stanceState(),
      visible: visible,
      meshes: meshes
    };
  };

  // Posture probe for scripts/check-avatar-viewer.js and the rig tests: the
  // hip and shoulder lines, the pelvic and chest turn, the head's roll, both
  // knee bends and both wrists, read off the master skeleton's world
  // positions with the idle sway (root yaw / roll / breathe, knee swing)
  // undone and restored, so the numbers do not depend on the parked frame.
  // Angles in degrees: line tilts are positive when the character's left
  // (+x) end is higher, yaws positive when the left end is further back
  // (the free right hip forward), knee bends 0 for a straight leg.
  function stanceState(rootArg) {
    var root = rootArg || modelRoot;
    if (!root || !masterBones.pelvis) return null;
    var savedRoot = {
      rotation: root.rotation.clone(),
      scale: root.scale.clone(),
      y: root.position.y
    };
    var savedKnee = kneeIdle
      ? [kneeIdle.thigh.quaternion.clone(), kneeIdle.calf.quaternion.clone(), kneeIdle.foot.quaternion.clone()]
      : null;
    root.rotation.set(0, 0, 0);
    root.scale.set(1, 1, 1);
    if (root === modelRoot) root.position.y = modelRestY;
    if (kneeIdle) {
      kneeIdle.thigh.quaternion.copy(kneeIdle.rests[0]);
      kneeIdle.calf.quaternion.copy(kneeIdle.rests[1]);
      kneeIdle.foot.quaternion.copy(kneeIdle.rests[2]);
    }
    root.updateMatrixWorld(true);
    var at = function (name) {
      var bone = masterBones[name];
      return bone ? bone.getWorldPosition(new THREE.Vector3()) : null;
    };
    var tilt = function (l, r) {
      return l && r ? Math.atan2(l.y - r.y, l.x - r.x) / DEG : null;
    };
    var yaw = function (l, r) {
      return l && r ? Math.atan2(-(l.z - r.z), l.x - r.x) / DEG : null;
    };
    var bend = function (hip, knee, ankle) {
      if (!hip || !knee || !ankle) return null;
      var a = knee.clone().sub(hip).normalize();
      var b = ankle.clone().sub(knee).normalize();
      return Math.acos(Math.max(-1, Math.min(1, a.dot(b)))) / DEG;
    };
    var thighL = at("thigh_l");
    var thighR = at("thigh_r");
    // The shoulder girdle is read at the clavicle roots, which ride on the
    // top spine bone: the upper-arm joints also move with a clavicle lift
    // (the wave), which is arm pose, not stance. armLineDeg keeps that
    // reading for reference.
    var clavL = at("clavicle_l");
    var clavR = at("clavicle_r");
    var armL = at("upperarm_l");
    var armR = at("upperarm_r");
    var eyeL = at("eyeRoot_l");
    var eyeR = at("eyeRoot_r");
    var handL = at("hand_l");
    var handR = at("hand_r");
    var footL = at("foot_l");
    var footR = at("foot_r");
    var out = {
      pelvicChannel: hasPelvicChannel(),
      weightSide: STANCE.weightSide,
      hipLineDeg: tilt(thighL, thighR),
      shoulderLineDeg: tilt(clavL, clavR),
      armLineDeg: tilt(armL, armR),
      headRollDeg: tilt(eyeL, eyeR),
      pelvisYawDeg: yaw(thighL, thighR),
      chestYawDeg: yaw(clavL, clavR),
      kneeBendDeg: {
        l: bend(thighL, at("calf_l"), footL),
        r: bend(thighR, at("calf_r"), footR)
      },
      footY: { l: footL ? footL.y : null, r: footR ? footR.y : null },
      hands: {
        l: handL ? [handL.x, handL.y, handL.z] : null,
        r: handR ? [handR.x, handR.y, handR.z] : null
      },
      // How far the two wrists are from mirror images of each other.
      wristAsymmetry: handL && handR
        ? Math.hypot(-handL.x - handR.x, handL.y - handR.y, handL.z - handR.z)
        : null
    };
    root.rotation.copy(savedRoot.rotation);
    root.scale.copy(savedRoot.scale);
    root.position.y = savedRoot.y;
    if (kneeIdle && savedKnee) {
      kneeIdle.thigh.quaternion.copy(savedKnee[0]);
      kneeIdle.calf.quaternion.copy(savedKnee[1]);
      kneeIdle.foot.quaternion.copy(savedKnee[2]);
    }
    root.updateMatrixWorld(true);
    return out;
  }

  // Face silhouette probe for scripts/check-avatar-viewer.js: Head_0's
  // skinned, morph-baked vertices measured against the eye line, in metres
  // (world space). Measured on the GLB, the ears end 4.5 cm under the eyes,
  // the chin tip sits ~6.3 cm under them and the head mesh runs on down the
  // neck to ~12 cm. The widths are the full x extent of a height band (the
  // frontal silhouette): cheek 5-6 cm under the eyes (below the ears), jaw
  // 6.5-8 cm, chin 8-9.5 cm (the underside of the jaw, which the bust camera
  // sees from below - where the sculpts move the silhouette most).
  // chinDepth / chinForward place the chin tip (the most forward point of
  // the lower face on the centre line, under the lower lip) against the eye
  // line. Read in the rest pose: the idle sway (root yaw / roll / breathe,
  // head nod) is undone for the measurement and restored, so the numbers do
  // not depend on which frame the caller parked. Hair-independent, so the
  // Face / Jaw / Chin travel can be read without a pixel classifier.
  function faceProfile() {
    var head = null;
    morphMeshes.forEach(function (mesh) {
      if ((mesh.name || "").indexOf("Head_") === 0) head = mesh;
    });
    if (!head || eyeBones.length < 2 || !modelRoot) return null;
    var savedRoot = {
      rotation: modelRoot.rotation.clone(),
      scale: modelRoot.scale.clone(),
      y: modelRoot.position.y
    };
    var savedHeads = headBones.map(function (bone) { return bone.rotation.clone(); });
    modelRoot.rotation.set(0, 0, 0);
    modelRoot.scale.set(1, 1, 1);
    modelRoot.position.y = modelRestY;
    headBones.forEach(function (bone, i) {
      bone.rotation.set(headRests[i].x, headRests[i].y, headRests[i].z);
    });
    modelRoot.updateMatrixWorld(true);
    var eye = eyeBones[0].getWorldPosition(new THREE.Vector3())
      .add(eyeBones[1].getWorldPosition(new THREE.Vector3()))
      .multiplyScalar(0.5);
    var pos = head.geometry.attributes.position;
    var v = new THREE.Vector3();
    var bands = {
      cheekWidth: { from: 0.05, to: 0.06, min: Infinity, max: -Infinity },
      jawWidth: { from: 0.065, to: 0.08, min: Infinity, max: -Infinity },
      chinWidth: { from: 0.08, to: 0.095, min: Infinity, max: -Infinity }
    };
    var chin = null;
    var i;
    for (i = 0; i < pos.count; i++) {
      sampleMeshPoint(head, i, v);
      var below = eye.y - v.y;
      Object.keys(bands).forEach(function (key) {
        var band = bands[key];
        if (below >= band.from && below <= band.to) {
          band.min = Math.min(band.min, v.x);
          band.max = Math.max(band.max, v.x);
        }
      });
      if (below > 0.06 && Math.abs(v.x - eye.x) < 0.012 && (!chin || v.z > chin.z)) {
        chin = v.clone();
      }
    }
    modelRoot.rotation.copy(savedRoot.rotation);
    modelRoot.scale.copy(savedRoot.scale);
    modelRoot.position.y = savedRoot.y;
    headBones.forEach(function (bone, i) { bone.rotation.copy(savedHeads[i]); });
    modelRoot.updateMatrixWorld(true);
    var out = {
      chinDepth: chin ? eye.y - chin.y : null,
      chinForward: chin ? chin.z - eye.z : null
    };
    Object.keys(bands).forEach(function (key) {
      var band = bands[key];
      out[key] = band.max > band.min ? band.max - band.min : null;
    });
    return out;
  }

  // Gaze and lid state: where each eyeball sits, where its iris axis points,
  // how far that is from the camera, and the Head_0 upper-lid morph weight.
  function eyeState() {
    var out = { lidDrop: null, lashLength: null, outerCornerLift: null, gaze: {} };
    morphMeshes.forEach(function (mesh) {
      if ((mesh.name || "").indexOf("Head_") !== 0) return;
      var idx = mesh.morphTargetDictionary["Shape_EyeLidHeight"];
      if (typeof idx === "number") out.lidDrop = mesh.morphTargetInfluences[idx];
      var lash = mesh.morphTargetDictionary["Shape_LashLength"];
      if (typeof lash === "number") out.lashLength = mesh.morphTargetInfluences[lash];
      var corner = mesh.morphTargetDictionary["Shape_EyesOuterCornersHigh"];
      if (typeof corner === "number") out.outerCornerLift = mesh.morphTargetInfluences[corner];
    });
    var pos = new THREE.Vector3();
    var fwd = new THREE.Vector3();
    var toCam = new THREE.Vector3();
    var q = new THREE.Quaternion();
    eyeBones.forEach(function (bone) {
      bone.updateWorldMatrix(true, false);
      bone.getWorldPosition(pos);
      bone.getWorldQuaternion(q);
      fwd.set(0, 0, 1).applyQuaternion(q).normalize();
      var entry = {
        position: [pos.x, pos.y, pos.z],
        forward: [fwd.x, fwd.y, fwd.z],
        scale: bone.scale.x,
        offCameraDeg: null,
        screen: null
      };
      if (camera) {
        toCam.subVectors(camera.position, pos).normalize();
        entry.offCameraDeg = (fwd.angleTo(toCam) * 180) / Math.PI;
        // Where the eye centre lands on the canvas (CSS px, y down) and how
        // many CSS px one metre covers at its depth, so a pixel check can
        // find the eyeball without re-deriving the camera rule.
        camera.updateMatrixWorld(true);
        var view = pos.clone().applyMatrix4(camera.matrixWorldInverse);
        var ndc = pos.clone().project(camera);
        var w = window.innerWidth;
        var h = window.innerHeight;
        entry.screen = {
          x: ((ndc.x + 1) / 2) * w,
          y: ((1 - ndc.y) / 2) * h,
          pxPerMetre: (h / 2) / Math.tan((camera.fov * Math.PI) / 360) / Math.max(1e-6, -view.z)
        };
      }
      out.gaze[rigName(bone)] = entry;
    });
    return out;
  }

    retargetSkeletons: retargetSkeletons,
    masterBoneNames: function () { return Object.keys(masterBones); },
    // The loaded figure, for the headless check to toggle layers on.
    modelRoot: function () { return modelRoot; },
    solveElbow: solveElbow
  };

  window.applyLook = applyLook;
})();
</script>
