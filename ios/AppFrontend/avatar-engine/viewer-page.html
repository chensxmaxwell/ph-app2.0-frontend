<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #status { display: none;
    position: absolute; left: 16px; right: 16px; top: 46%;
    text-align: center; color: #f3f3f3;
    background: rgba(0,0,0,0.42);
    border-radius: 10px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.85);
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, sans-serif;
    pointer-events: none;
    padding: 8px 16px;
    margin: 0 auto;
    max-width: 280px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status" hidden></div>
<script src="three.min.js"></script>
<script src="GLTFLoader.js?v=3"></script>
<script>
(function () {
  // Same tables as src/screens/avatar/engine/viewer-html.ts (the Customize
  // swatches and the 2D LookFace fallback); __tests__/avatar-viewer-rig.test.ts
  // fails if they drift. Style C (soft semi-real intimate, 2026-09-06): the
  // default hair is a soft dark brown instead of the #5c3310 orange chestnut,
  // the default skin a peach with pink under it instead of the #e2b089 tan.
  var HAIR_COLORS = ["#1a1410","#55392a","#d4b483","#8b2a1a","#e891b0","#d0d0d0"];
  var SKIN_COLORS = ["#f3d0bc","#e4b696","#c17a45","#8a4f28"];
  var EYE_COLORS = ["#3a2418","#3f6b3a","#2e4d7a","#5a3a1e","#111111"];
  var look = {
    appearanceIndex: 2, hairStyle: 2, hairColor: 1, skinTone: 1, eyeColor: 0,
    upperArms: 0.58, chest: 0.55, forearms: 0.55, backAndHips: 0.56,
    faceWidth: 0.4, jaw: 0.38, chin: 0.5, eyeSize: 0.5, age: 0.28,
    viewMode: "full", revealBody: false
  };

  var renderer, scene, camera;
  var modelRoot, morphMeshes = [];
  var modelRestY = 0;
  var skinMats = [];
  var headMats = [];
  var hairMats = [];
  var eyeMats = [];
  var headBones = [];
  var headRests = [];
  var eyeBones = [];
  var eyeRests = [];
  var armBones = [];
  var armRests = [];
  var fingerBones = [];
  var fingerRests = [];
  var stanceBones = [];
  var stanceRests = [];
  var kneeIdle = null;
  var masterBones = {};
  var FALLBACK_HEIGHT = 1.75;
  var MIN_PLAUSIBLE_HEIGHT = 1.2;
  var modelHeight = FALLBACK_HEIGHT;
  var pendingLook = null;
  var ready = false;
  var clock = 0;

  function setStatus(text) {
    var el = document.getElementById("status");
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }

  function clamp01(v) { return Math.max(0, Math.min(1, Number(v) || 0)); }
  function hexColor(hex) { return new THREE.Color(hex); }

  function materialsOf(obj) {
    if (!obj.material) return [];
    return Array.isArray(obj.material) ? obj.material : [obj.material];
  }

  function setMorph(mesh, name, value) {
    if (!mesh.morphTargetDictionary) return;
    var idx = mesh.morphTargetDictionary[name];
    if (idx === undefined) return;
    mesh.morphTargetInfluences[idx] = clamp01(value);
  }

  function pruneToShapes(mesh) {
    var dict = mesh.morphTargetDictionary || {};
    var geo = mesh.geometry;
    if (!geo || !geo.morphAttributes) return;
    var keepIdx = [];
    var nextDict = {};
    Object.keys(dict).forEach(function (name) {
      if (!name || name.indexOf("Shape_") !== 0) return;
      var index = dict[name];
      if (typeof index !== "number") return;
      var positions = geo.morphAttributes.position;
      if (positions && !positions[index]) return;
      var normals = geo.morphAttributes.normal;
      if (normals && !normals[index]) return;
      nextDict[name] = keepIdx.length;
      keepIdx.push(index);
    });
    ["position", "normal"].forEach(function (key) {
      var arr = geo.morphAttributes[key];
      if (!arr) return;
      geo.morphAttributes[key] = keepIdx.map(function (i) { return arr[i]; });
    });
    if (!geo.morphAttributes.normal || !geo.morphAttributes.normal.length) {
      delete geo.morphAttributes.normal;
    }
    mesh.morphTargetDictionary = nextDict;
    mesh.morphTargetInfluences = keepIdx.map(function () { return 0; });
  }

  function mild(v, amount) {
    return clamp01(v) * (amount == null ? 0.28 : amount);
  }

  // The Face / Jaw / Chin sliders drive Head_0's three sculpt morphs through
  // mild(v, cap) from the base mesh. The caps were 0.22 / 0.22 / 0.18:
  // measured on the GLB the sculpts move the face 9.7 / 14.2 / 8.4 mm at
  // weight 1, so that was a 2-3 mm silhouette change end to end, which at
  // the bust camera (about 1 px per mm) the design review's headless renders
  // read as not obvious, chin weakest. The caps signed off are 0.45 / 0.45
  // and, for the chin, 0.50: at the 0.40 first asked for the chin still
  // measured half the travel of the other two (Sharpness is the kit's only
  // chin sculpt and most of its 8.4 mm lives in the eye region the mask
  // removes), so it took the extra raise design allowed. SCULPT_WIDTH_FACTOR
  // carries the Squareness raise onto the Face slider's NoseWidth /
  // MouthWide companions; EyesSquare reshapes the eye and stays at 0.1.
  // Their reach over the eyes is masked out at load
  // (maskEyeRegion): Stern moves the lid margin 10.8 mm at weight 1, so at
  // these caps the lids would otherwise hood by ~2 mm already at the
  // default look. Design re-signs Face / Jaw / Chin 0 / 0.5 / 1 after this
  // bump - the default preset (0.48 / 0.46 / 0.5) now sits about halfway up.
  var SCULPT_MORPHS = ["Shape_Squareness", "Shape_Stern", "Shape_Sharpness"];
  var SCULPT_CAPS = { squareness: 0.45, stern: 0.45, sharpness: 0.5 };
  var SCULPT_WIDTH_FACTOR = SCULPT_CAPS.squareness / 0.22;

  function sculptMorphs(faceWidth, jaw, chin) {
    return {
      squareness: mild(faceWidth, SCULPT_CAPS.squareness),
      stern: mild(jaw, SCULPT_CAPS.stern),
      sharpness: mild(chin, SCULPT_CAPS.sharpness)
    };
  }

  // Head_0's Shape_EyeLidHeight drops the upper lid (the margin moves ~28mm
  // at 1.0 = fully closed; the lower lid barely moves). At rest the BoZo
  // lids open ~24deg above and ~32deg below the iris axis - a round,
  // startled aperture that TestFlight 1.2 (12) read as a horror-doll stare.
  // Calibrated on the rendered eye in headless Chrome (share of the iris
  // height under the upper lid, iris paint 1.0): 0.16 -> 3%, 0.20 -> 9%,
  // 0.24 -> 14%, 0.28 -> 20%, 0.32 -> 28%, and the lid reaches the pupil at
  // ~0.34. 1.2 (14) shipped 0.20 -> 0.12 with Size (3-9%: still a stare, and
  // opening further for bigger eyes). A relaxed lid covers 15-25% of the
  // iris, so Size now runs the lid the other way: UPPER_LID_DROP at Size 0
  // (~27%, the tight aperture that makes a small stylized eye read cute),
  // UPPER_LID_DROP_LARGE at Size 1 (~15%, still resting on the iris so a big
  // eye reads doll-pretty, never startled). The pupil stays clear at every
  // Size (see irisSizeFor).
  function upperLidDrop(eyeSize) {
    return UPPER_LID_DROP - clamp01(eyeSize) * (UPPER_LID_DROP - UPPER_LID_DROP_LARGE);
  }

  // Brows follow Size the same way: no arch lift on a small or default eye
  // (the TestFlight screenshots read the old 0.02 + 0.04 * Size lift as part
  // of the stare), a slight settle toward the eye for small eyes
  // (Shape_LowerBrows moves 6.7mm at 1.0, so 0.12 is under 1mm).
  function browMorphs(eyeSize, jaw) {
    var eye = clamp01(eyeSize);
    return {
      raise: eye * 0.03,
      lower: mild(jaw, 0.08) + (1 - eye) * 0.12
    };
  }

  // The Body tab's "Back and hips" slider (look.backAndHips, `hips` below)
  // fans out over four body morphs. Design-signed 2026-09-07 (body posture
  // pass): waist 0.72 -> 0.85 and curvy 0.4 -> 0.55 per unit of hips, so the
  // mid slider (0.56 on the default look) reads as a waist-to-hip curve
  // instead of a straight torso, and the belly starts at 0.62 instead of
  // 0.55 so that same mid stays flat-bellied; the top end (hips 1) still
  // carries a soft belly (0.27) and the weight term above 0.65 is unchanged.
  // Slider 0 leaves every hips morph at 0, so 0 vs 1 stays readable:
  // 0.85 / 0.55 / 1.0 / 0.27 of travel on waist / curvy / butt / belly.
  var HIPS_MAPPING = {
    waist: 0.85,
    curvy: 0.55,
    bellyFrom: 0.62,
    belly: 0.7,
    weightFrom: 0.65,
    weight: 0.35
  };

  function hipsMorphs(hips) {
    var h = clamp01(hips);
    return {
      butt: h,
      waist: h * HIPS_MAPPING.waist,
      curvy: h * HIPS_MAPPING.curvy,
      belly: Math.max(0, h - HIPS_MAPPING.bellyFrom) * HIPS_MAPPING.belly,
      weight: Math.max(0, h - HIPS_MAPPING.weightFrom) * HIPS_MAPPING.weight
    };
  }

  function applyMeshLook(mesh, next) {
    var arms = (clamp01(next.upperArms) + clamp01(next.forearms)) * 0.5;
    var hips = hipsMorphs(next.backAndHips);
    var eye = clamp01(next.eyeSize);
    var brows = browMorphs(eye, next.jaw);
    var sculpt = sculptMorphs(next.faceWidth, next.jaw, next.chin);
    setMorph(mesh, "Shape_Squareness", sculpt.squareness);
    setMorph(mesh, "Shape_Stern", sculpt.stern);
    setMorph(mesh, "Shape_Sharpness", sculpt.sharpness);
    setMorph(mesh, "Shape_EyesSquare", mild(next.faceWidth, 0.1));
    setMorph(mesh, "Shape_EyeLidHeight", upperLidDrop(eye));
    setMorph(mesh, "Shape_NoseWidth", mild(next.faceWidth, 0.16 * SCULPT_WIDTH_FACTOR));
    setMorph(mesh, "Shape_MouthWide", mild(next.faceWidth, 0.14 * SCULPT_WIDTH_FACTOR));
    setMorph(mesh, "Shape_MouthThin", (1 - clamp01(next.chin)) * 0.1);
    setMorph(mesh, "Shape_RaiseBrows", brows.raise);
    setMorph(mesh, "Shape_LowerBrows", brows.lower);
    setMorph(mesh, "Shape_NoseTiltDown", mild(next.chin, 0.08));
    setMorph(mesh, "Shape_LashLength", LASH_LENGTH);
    setMorph(mesh, "Shape_EyesOuterCornersHigh", OUTER_CORNER_LIFT);
    setMorph(mesh, "Shape_EyesOuterCornersLow", 0);
    setMorph(mesh, "Shape_BrowsThickness", BROW_THICKNESS);
    setMorph(mesh, "Shape_Chest", clamp01(next.chest));
    setMorph(mesh, "Shape_Muscle", arms);
    setMorph(mesh, "Shape_ButtSize", hips.butt);
    setMorph(mesh, "Shape_WaistSize", hips.waist);
    setMorph(mesh, "Shape_Curvy", hips.curvy);
    setMorph(mesh, "Shape_Belly", hips.belly);
    setMorph(mesh, "Shape_Weight", clamp01(next.age) * 0.28 + hips.weight);
    setMorph(mesh, "Shape_NeckThickness", mild(next.jaw, 0.22));
    setMorph(mesh, "Shape_BodyType", arms * 0.35);
  }

  function prefixIndex(name, prefix) {
    if (!name || name.indexOf(prefix) !== 0) return -1;
    var parsed = parseInt(name.slice(prefix.length), 10);
    return isNaN(parsed) ? -1 : parsed;
  }

  // Skin parts (Body_<Part> meshes) that each outfit leaves uncovered. Derived
  // from the bones each garment is skinned to in bozo-male.glb:
  //   0 Shirt (short sleeve, ends at upperarm_twist_02) + Jeans + SportsShoes
  //   1 CasualJacket (sleeve reaches hand_l/r) + CargoPants + WorkBoots
  //   2 Hoodie (cuff reaches hand + thumb_01) + BaggyPants + StreetShoes
  //   3 TankTop (clavicle/upperarm root only) + DressPants + ComfyShoes
  // Hands must be listed for every outfit or the character has no hands.
  var SKIN_BY_OUTFIT = {
    0: { Hand: 1, Wrist: 1, LowerArm: 1, UpperArm: 1, Neck: 1 },
    1: { Hand: 1, Neck: 1 },
    2: { Hand: 1, Neck: 1 },
    3: { Hand: 1, Wrist: 1, LowerArm: 1, UpperArm: 1, Shoulder: 1, Neck: 1 }
  };

  function bodyPart(name) {
    if (!name || name.indexOf("Body_") !== 0) return "";
    return name.slice(5);
  }

  function nameHasExposedSkin(name, outfit) {
    var allowed = SKIN_BY_OUTFIT[outfit] || SKIN_BY_OUTFIT[0];
    return !!allowed[bodyPart(name)];
  }

  function isFigureMesh(name) {
    return (
      name.indexOf("Body_") === 0 ||
      name.indexOf("Head_") === 0 ||
      name.indexOf("Eyes_") === 0 ||
      name.indexOf("Outfit_") === 0 ||
      name.indexOf("Hair_") === 0
    );
  }

  var _sample = new THREE.Vector3();

  // World-space point of vertex `index`. Skinned vertices must go through the
  // skeleton: bozo-male.glb stores them in armature space and the armature
  // node carries a 90deg + 0.01 transform, so position * matrixWorld lays the
  // figure on its side at centimetre scale (Y extent ~0.003).
  function sampleMeshPoint(obj, index, target) {
    if (obj.isSkinnedMesh && typeof obj.boneTransform === "function") {
      obj.boneTransform(index, target);
      return obj.localToWorld(target);
    }
    target.fromBufferAttribute(obj.geometry.attributes.position, index);
    return obj.localToWorld(target);
  }

  function measureFigureBox(box, filter, includeHidden) {
    box.makeEmpty();
    if (!modelRoot) return box;
    modelRoot.updateMatrixWorld(true);
    modelRoot.traverse(function (obj) {
      if (!obj.isMesh || !obj.geometry || !obj.geometry.attributes.position) return;
      if (!obj.visible && !includeHidden) return;
      var name = obj.name || "";
      if (!isFigureMesh(name)) return;
      if (filter && !filter(name)) return;
      var pos = obj.geometry.attributes.position;
      var stride = Math.max(1, Math.floor(pos.count / 400));
      var i;
      for (i = 0; i < pos.count; i += stride) {
        box.expandByPoint(sampleMeshPoint(obj, i, _sample));
      }
    });
    return box;
  }

  function placeFigure() {
    // Measure in the rest pose so grounding/centering does not drift per outfit.
    resetArmBones();
    resetFingerBones();
    resetStanceBones();
    var box = measureFigureBox(new THREE.Box3());
    if (box.isEmpty()) {
      box.setFromObject(modelRoot);
    }
    var size = box.getSize(new THREE.Vector3());
    var center = box.getCenter(new THREE.Vector3());
    modelHeight = figureHeight(size.y);
    if (modelHeight === size.y) {
      modelRoot.position.x -= center.x;
      modelRoot.position.z -= center.z;
      modelRoot.position.y -= box.min.y;
    }
    modelRestY = modelRoot.position.y;
  }

  // A measured height below MIN_PLAUSIBLE_HEIGHT means the box did not come
  // from the skinned figure (e.g. raw positions); frame a nominal adult instead
  // of zooming the camera onto the shins.
  function figureHeight(measuredY) {
    if (typeof measuredY === "number" && measuredY >= MIN_PLAUSIBLE_HEIGHT) return measuredY;
    return FALLBACK_HEIGHT;
  }

  // GLTFLoader renames duplicate nodes (hand_l, hand_l_1, hand_l_2...); the
  // glTF name survives in userData.name.
  function rigName(obj) {
    return (obj && ((obj.userData && obj.userData.name) || obj.name)) || "";
  }

  // The GLB carries one armature per imported kit piece (23 copies of the same
  // bone names). Three of the hair rigs (Hair_0_0_0, Hair_1_1_0, Hair_3_1_0)
  // were exported with a displaced pelvis, so their meshes rendered 1.4m off
  // the body. Drive every mesh from one master skeleton, matched by bone name;
  // hair-only bones (HairFront, Hair_Back...) are re-attached under the master
  // head so they follow it.
  function retargetSkeletons(root) {
    var armatures = [];
    root.traverse(function (obj) {
      if (obj.isBone && obj.parent && !obj.parent.isBone) armatures.push(obj);
    });
    var best = null;
    armatures.forEach(function (arm) {
      var count = 0;
      arm.traverse(function (b) { if (b.isBone) count += 1; });
      if (!best || count > best.count) best = { bone: arm, count: count };
    });
    masterBones = {};
    if (!best) return;
    best.bone.traverse(function (b) {
      var key = rigName(b);
      if (b.isBone && !masterBones[key]) masterBones[key] = b;
    });
    root.updateMatrixWorld(true);
    var meshes = [];
    root.traverse(function (obj) {
      if (obj.isSkinnedMesh && obj.skeleton) meshes.push(obj);
    });
    meshes.forEach(function (mesh) {
      var bones = mesh.skeleton.bones.map(function (bone) {
        var master = masterBones[rigName(bone)];
        if (master) return master;
        var parent = bone.parent;
        var masterParent = parent && parent.isBone ? masterBones[rigName(parent)] : null;
        if (masterParent && parent !== masterParent) {
          masterParent.attach(bone);
        }
        return bone;
      });
      mesh.bind(new THREE.Skeleton(bones, mesh.skeleton.boneInverses), mesh.bindMatrix);
    });
    root.updateMatrixWorld(true);
  }

  // Which figure meshes a look draws. Hair_<i>_* / Outfit_<i>_* follow the
  // selected indices; Head_* and Eyes_* are always on (Eyes_0 is the eyeball
  // mesh with the MAT_Iris shader - hiding it leaves empty sockets); Body_*
  // skin parts show only where the outfit leaves skin uncovered, or when the
  // Body sliders reveal the body through faded clothes.
  function figureMeshVisible(name, next) {
    if (name.indexOf("Icosphere") === 0) return false;
    var hairIdx = prefixIndex(name, "Hair_");
    if (hairIdx >= 0) return hairIdx === (next.hairStyle | 0);
    var outfitIdx = prefixIndex(name, "Outfit_");
    if (outfitIdx >= 0) return outfitIdx === (next.appearanceIndex | 0);
    if (name.indexOf("Head_") === 0 || name.indexOf("Eyes_") === 0) return true;
    if (name.indexOf("Body_") === 0) {
      return !!next.revealBody || nameHasExposedSkin(name, next.appearanceIndex | 0);
    }
    return true;
  }

  function applyOutfitFade(obj, faded) {
    materialsOf(obj).forEach(function (mat) {
      if (!mat || typeof mat !== "object") return;
      if (!mat._phOrig) {
        mat._phOrig = {
          transparent: !!mat.transparent,
          opacity: typeof mat.opacity === "number" ? mat.opacity : 1,
          depthWrite: mat.depthWrite !== false
        };
      }
      if (faded) {
        mat.transparent = true;
        mat.opacity = 0.22;
        mat.depthWrite = false;
      } else {
        mat.transparent = mat._phOrig.transparent;
        mat.opacity = mat._phOrig.opacity;
        mat.depthWrite = mat._phOrig.depthWrite;
      }
      mat.needsUpdate = true;
    });
  }

  function applyVisibility(next) {
    if (!modelRoot) return;
    modelRoot.traverse(function (obj) {
      if (!obj.isMesh) return;
      var name = obj.name || "";
      obj.visible = figureMeshVisible(name, next);
      if (prefixIndex(name, "Outfit_") >= 0) {
        applyOutfitFade(obj, !!next.revealBody && obj.visible);
      }
    });
  }

  function tintLook(next) {
    var age = clamp01(next.age);
    var white = new THREE.Color(0xffffff);
    var skin = hexColor(SKIN_COLORS[next.skinTone] || SKIN_COLORS[1]);
    skin.lerp(white, 0.08);
    skinMats.forEach(function (mat) {
      mat.color.copy(skin);
      mat.roughness = SKIN_LOOK.roughness + age * SKIN_LOOK.ageRoughness;
      mat.needsUpdate = true;
    });
    var hair = hexColor(HAIR_COLORS[next.hairColor] || HAIR_COLORS[0]);
    var brow = browColorFor(hair);
    var head = skin.clone();
    headMats.forEach(function (mat) {
      mat.color.copy(head);
      mat.roughness = SKIN_LOOK.roughness - 0.04 + age * SKIN_LOOK.ageRoughness;
      if (mat.userData.browColor) mat.userData.browColor.copy(brow);
      mat.needsUpdate = true;
    });
    hairMats.forEach(function (mat) {
      mat.color.copy(hair);
      mat.roughness = HAIR_ROUGHNESS + age * 0.12;
      mat.needsUpdate = true;
    });
    var iris = hexColor(EYE_COLORS[next.eyeColor] || EYE_COLORS[0]);
    var irisSize = irisSizeFor(next.eyeSize);
    eyeMats.forEach(function (mat) {
      mat.color.setRGB(1, 1, 1);
      mat.userData.irisSize = irisSize;
      if (mat.userData.irisColor) mat.userData.irisColor.copy(iris);
      if (mat.userData.shader && mat.userData.shader.uniforms) {
        if (mat.userData.shader.uniforms.irisColor) mat.userData.shader.uniforms.irisColor.value.copy(iris);
        if (mat.userData.shader.uniforms.irisSize) mat.userData.shader.uniforms.irisSize.value = irisSize;
      }
      mat.roughness = 0.28;
      mat.metalness = 0;
      mat.needsUpdate = true;
    });
  }

  function canvasTexture(draw, size) {
    var c = document.createElement("canvas");
    c.width = c.height = size || 256;
    draw(c.getContext("2d"), c.width);
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    tex.needsUpdate = true;
    return tex;
  }

  function makeEnvMap() {
    if (!THREE.PMREMGenerator) return null;
    var envScene = new THREE.Scene();
    var sky = new THREE.Mesh(
      new THREE.SphereGeometry(12, 16, 12),
      new THREE.MeshBasicMaterial({ color: LIGHT_RIG.env.sky, side: THREE.BackSide })
    );
    envScene.add(sky);
    var floor = new THREE.Mesh(
      new THREE.CylinderGeometry(12, 12, 0.2, 24),
      new THREE.MeshBasicMaterial({ color: LIGHT_RIG.env.floor })
    );
    floor.position.y = -4;
    envScene.add(floor);
    var warm = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 12, 8),
      new THREE.MeshBasicMaterial({ color: LIGHT_RIG.env.warm })
    );
    warm.position.set(4, 6, 3);
    envScene.add(warm);
    var pmrem = new THREE.PMREMGenerator(renderer);
    var rt = pmrem.fromScene(envScene, 0.06);
    pmrem.dispose();
    return rt.texture;
  }

  // Head_0 carries its brow and lash "hair cards" as geometry (COLOR_1 marks
  // 458 vertices: 218 brow, 240 lash - 192 on the upper lids, 48 on the
  // lower), but ph_tex_SkinAlbedo is one flat skin colour, so both render as
  // skin-coloured slabs: the brows read as tan ridges and the lashes only
  // show as the grazing-angle shading of a thin card. Measured on the GLB,
  // the cards sit in a UV strip of their own - upper lashes at u 0.143-0.146,
  // brows and lower lashes at u 0.134-0.138, all at v 0.217-0.240 - so the
  // head shader can ink them: the upper lash card becomes the liner (a
  // winged band that thickens toward the outer corner, following
  // Shape_LashLength and the lid morphs), the brow and lower-lash cards take
  // a darkened hair colour. No new geometry or texture; what this cannot do
  // is individual lash hairs or a smoky lid gradient (see the handoff).
  var LASH_CARD_U = [0.1425, 0.1465];
  var BROW_CARD_U = [0.1330, 0.1385];
  var CARD_V = [0.214, 0.243];
  // Liner ink: near-black warm, mixed at `density` over the card.
  var LASH_INK = { color: [0.012, 0.009, 0.009], density: 0.97 };
  // Brow / lower-lash cards: mix toward browColorFor(hair) by this much.
  var BROW_INK = 0.86;
  // Shape_LashLength on Head_0: 1.0 moves the upper lash tips 4.5 mm mean
  // (up and forward, a curl; 8 mm max). 1.2 (11)-(14) and #36 ran 0.42.
  var LASH_LENGTH = 0.8;
  // Shape_EyesOuterCornersHigh: 1.0 lifts the lid-corner skin 1.5 mm and
  // pushes it 1 mm outward (lash tips 3 mm) - the slight feline lift of the
  // reference. Opening the corner does not open the aperture, so it cannot
  // bring the stare back.
  var OUTER_CORNER_LIFT = 0.9;

  // Hair gloss. At 0.42 (+ 0.12 * age) the pink rim light's specular blew
  // the crown cards out to a white-pink fringe along the top of the hair
  // (TF 1.2.21 bust; measured with the lights toggled one at a time: 5,300
  // near-white pixels in a 4x crop, 0 with the rim off, 0 at roughness 0.6).
  // The hair map's lighter strands carry the sheen; the material only needs
  // enough gloss to read as hair, not glass. Style C: 0.60 (softer still,
  // the strand streaks in hairShaderChunk carry the sheen variation).
  var HAIR_ROUGHNESS = 0.6;

  // Style C lips: the #41 paint was (0.70, 0.26, 0.30) mixed 0.62 with a
  // near-black line at 0.48 - under the cool fill it read as mauve lipstick
  // on a clay face. A rose-nude at half strength lets the skin through, the
  // line is a soft shadow, and `gloss` takes that much off the roughness on
  // the lip mask (skinDetailChunk) for the board's "soft sheen".
  var LIP_PAINT = { color: [0.78, 0.42, 0.40], mix: 0.5, line: [0.46, 0.20, 0.20], lineMix: 0.36, gloss: 0.22 };
  // A faint flush on the cheeks, a touch stronger than #41's 0.12 and less
  // pink.
  var CHEEK_PAINT = { color: [0.88, 0.50, 0.46], mix: 0.16 };
  // The skin under the brow slab: #41 inked it 0.92 near-black, which showed
  // as a hard dark edge under the slab; the card ink carries the brow now.
  var BROW_SKIN_INK = 0.6;
  // Shape_BrowsThickness on Head_0: 0.32 in #41 made the slab a ridge.
  var BROW_THICKNESS = 0.12;
  // Soft eye-socket shade on the head skin: the lid skin is darkened by its
  // own weight on the eye bones (1.0 on the lid margin, ~0.3 at the crease,
  // 0 by the brow - the same falloff applyEyeScale and maskEyeRegion rely
  // on), carried from the vertex shader as vPhEye. A shading cue, not
  // makeup: the flat albedo otherwise lights the lid margin as bright as the
  // cheek and the eye sits on the face instead of in it.
  var SOCKET_SHADE = 0.14;

  // Slot indices of eyeRoot_l / eyeRoot_r in a skinned mesh's skeleton (the
  // JOINTS_0 values its vertices carry), -1 when the rig has no eye bone.
  function eyeBoneSlots(mesh) {
    var slots = [-1, -1];
    if (!mesh || !mesh.isSkinnedMesh || !mesh.skeleton) return slots;
    mesh.skeleton.bones.forEach(function (bone, i) {
      var name = rigName(bone);
      if (name === "eyeRoot_l") slots[0] = i;
      if (name === "eyeRoot_r") slots[1] = i;
    });
    return slots;
  }

  // GLSL after skinbase_vertex: the vertex's summed weight on the two eye
  // bone slots (uniform eyeSlots; -1 when the material's mesh has none).
  function eyeWeightVertexChunk() {
    return [
      "vPhEye = 0.0;",
      "#ifdef USE_SKINNING",
      "vPhEye += (abs(skinIndex.x - eyeSlots.x) < 0.5 || abs(skinIndex.x - eyeSlots.y) < 0.5) ? skinWeight.x : 0.0;",
      "vPhEye += (abs(skinIndex.y - eyeSlots.x) < 0.5 || abs(skinIndex.y - eyeSlots.y) < 0.5) ? skinWeight.y : 0.0;",
      "vPhEye += (abs(skinIndex.z - eyeSlots.x) < 0.5 || abs(skinIndex.z - eyeSlots.y) < 0.5) ? skinWeight.z : 0.0;",
      "vPhEye += (abs(skinIndex.w - eyeSlots.x) < 0.5 || abs(skinIndex.w - eyeSlots.y) < 0.5) ? skinWeight.w : 0.0;",
      "#endif",
      "vPhEye = clamp(vPhEye, 0.0, 1.0);"
    ].join("\n") + "\n";
  }

  // Lash clusters on the upper lash card: `count` bundles along the lid (v
  // runs along the card, 0.214-0.243), the ink thinning by `tipThin` between
  // them toward the tips (u ~0.143; the root at u ~0.146 stays a solid line,
  // the "wet line" of the lid margin).
  var LASH_CLUSTER = { count: 11, tipThin: 0.45 };

  // Brow colour from the hair colour: darker than the hair and pulled toward
  // a neutral dark, so a chestnut head does not get orange slabs and blonde
  // hair still gets defined brows instead of tan ridges.
  function browColorFor(hair) {
    var c = hair.clone().multiplyScalar(0.42);
    c.lerp(new THREE.Color(0.09, 0.075, 0.07), 0.3);
    return c;
  }

  function cardMask(name, uRange) {
    return "float " + name + " = step(" + uRange[0].toFixed(4) + ", fu.x) * step(fu.x, " + uRange[1].toFixed(4) + ") * step(" + CARD_V[0].toFixed(3) + ", fu.y) * step(fu.y, " + CARD_V[1].toFixed(3) + ");";
  }

  function vec3Of(rgb) {
    return "vec3(" + rgb.map(function (v) { return v.toFixed(2); }).join(", ") + ")";
  }

  // GLSL appended after map_fragment on the head material: lips, the skin
  // under the brows, cheeks, then the ink on the lash and brow cards.
  function headPaintChunk() {
    var lashClusterFreq = (LASH_CLUSTER.count * 2 * Math.PI) / (CARD_V[1] - CARD_V[0]);
    return [
      "vec2 fu = vUv;",
      "float lip = 1.0 - smoothstep(0.12, 1.0, length((fu - vec2(0.126, 0.162)) / vec2(0.028, 0.0085)));",
      "float lipLine = 1.0 - smoothstep(0.18, 1.0, length((fu - vec2(0.126, 0.160)) / vec2(0.022, 0.0028)));",
      "diffuseColor.rgb = mix(diffuseColor.rgb, " + vec3Of(LIP_PAINT.color) + ", lip * " + LIP_PAINT.mix.toFixed(2) + ");",
      "diffuseColor.rgb = mix(diffuseColor.rgb, " + vec3Of(LIP_PAINT.line) + ", lipLine * " + LIP_PAINT.lineMix.toFixed(2) + ");",
      "float phLip = lip;",
      "float bL = 1.0 - smoothstep(0.36, 1.0, length((fu - vec2(0.095, 0.090)) / vec2(0.024, 0.0065)));",
      "float bR = 1.0 - smoothstep(0.36, 1.0, length((fu - vec2(0.157, 0.090)) / vec2(0.024, 0.0065)));",
      "diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.09, 0.05, 0.04), max(bL, bR) * " + BROW_SKIN_INK.toFixed(2) + ");",
      "float cL = 1.0 - smoothstep(0.35, 1.0, length((fu - vec2(0.080, 0.155)) / vec2(0.018, 0.014)));",
      "float cR = 1.0 - smoothstep(0.35, 1.0, length((fu - vec2(0.172, 0.155)) / vec2(0.018, 0.014)));",
      "diffuseColor.rgb = mix(diffuseColor.rgb, " + vec3Of(CHEEK_PAINT.color) + ", max(cL, cR) * " + CHEEK_PAINT.mix.toFixed(2) + ");",
      "diffuseColor.rgb *= 1.0 - vPhEye * " + SOCKET_SHADE.toFixed(2) + ";",
      cardMask("lashCard", LASH_CARD_U),
      cardMask("browCard", BROW_CARD_U),
      "diffuseColor.rgb = mix(diffuseColor.rgb, browColor, browCard * " + BROW_INK.toFixed(2) + ");",
      // Tip (u toward the low edge of the window) -> root (high edge).
      "float lashTip = 1.0 - smoothstep(" + LASH_CARD_U[0].toFixed(4) + ", " + LASH_CARD_U[1].toFixed(4) + ", fu.x);",
      "float lashCluster = 0.5 + 0.5 * sin(fu.y * " + lashClusterFreq.toFixed(1) + ");",
      "float lashInk = mix(1.0, lashCluster, lashTip * " + LASH_CLUSTER.tipThin.toFixed(2) + ");",
      "diffuseColor.rgb = mix(diffuseColor.rgb, vec3(" + LASH_INK.color.map(function (v) { return v.toFixed(3); }).join(", ") + "), lashCard * " + LASH_INK.density.toFixed(2) + " * lashInk);",
      // Brow and lash cards are hair, not skin: matte (see skinDetailChunk).
      "float phCard = max(browCard, lashCard);"
    ].join("\n") + "\n";
  }

  // Style C lighting: soft warm key, gentle warm bounce, weak warm rim,
  // warm hemisphere ground. The #41 rig (hemi 0xffefe4 / 0x2a2036 at 0.62,
  // key 0xffe6d2 1.25, fill 0x9eb0d4 0.4, rim 0xffc4d8 0.7, exposure 1.12,
  // lavender env sky 0xcbbdd8) lit the shadow side of the face blue-grey and
  // the crown pink-white - the "clay placeholder" read. Positions are world
  // metres round a 1.8 m figure; the key sits high on the camera's right.
  var LIGHT_RIG = {
    exposure: 1.1,
    hemisphere: { sky: 0xfff0e6, ground: 0x5a4038, intensity: 0.56 },
    key: { color: 0xffe4cf, intensity: 1.15, position: [0.6, 1.85, 1.6] },
    fill: { color: 0xf4dfd4, intensity: 0.5, position: [-1.4, 0.7, 0.6] },
    rim: { color: 0xffd6c2, intensity: 0.34, position: [0.1, 1.2, -1.7] },
    env: { sky: 0xd9cfc8, floor: 0x3a2e2a, warm: 0xffd8b8 }
  };

  // Style C skin: a dielectric with a thin oily clearcoat (the soft specular
  // on nose, forehead and lips), an SSS approximation on the key light -
  // `sssTint` added where the surface turns from lit to unlit (the red
  // terminator of skin), `shadowWarm` lifting the unlit side by `shadowLift`
  // of the albedo (instead of the fill's blue) - and a fine roughness /
  // albedo noise (pores) so the flat ph_tex_SkinAlbedo does not read as
  // clay. Head and body take the same table; the head gets a touch more SSS.
  var SKIN_LOOK = {
    roughness: 0.52,
    ageRoughness: 0.08,
    clearcoat: 0.16,
    clearcoatRoughness: 0.52,
    envMapIntensity: 0.22,
    sssTint: [0.62, 0.14, 0.06],
    sssHead: 0.24,
    sssBody: 0.2,
    shadowWarm: [0.5, 0.24, 0.18],
    shadowLift: 0.1,
    poreRoughness: 0.08,
    poreAlbedo: 0.025,
    cardRoughness: 0.4
  };

  // GLSL for the skin materials. `roughness` goes after roughnessmap_fragment
  // (pores, lip sheen); `light` goes right before the shader's final
  // gl_FragColor line (OUTPUT_LINE - three r128 has no output_fragment
  // chunk; #41's wrap term targeted that include and never landed) (the SSS-style
  // terminator warmth and shadow lift against the key direction, which
  // updateKeyDirection feeds in view space every frame). `phLip` is 0 on the
  // body material (declared by its own chunk) and the lip mask on the head.
  function skinDetailChunk(part, sss) {
    var strength = typeof sss === "number" ? sss : SKIN_LOOK.sssHead;
    var roughness = [
      "float phN1 = fract(sin(dot(floor(vUv * 1400.0), vec2(12.9898, 78.233))) * 43758.5453);",
      "float phN2 = fract(sin(dot(floor(vUv * 520.0), vec2(39.3468, 11.135))) * 24634.6345);",
      "float phPore = phN1 * 0.6 + phN2 * 0.4;",
      "roughnessFactor = clamp(roughnessFactor + (phPore - 0.5) * " + SKIN_LOOK.poreRoughness.toFixed(2) + " - phLip * " + LIP_PAINT.gloss.toFixed(2) + " + phCard * " + SKIN_LOOK.cardRoughness.toFixed(2) + ", 0.2, 1.0);",
      "diffuseColor.rgb *= 1.0 + (phPore - 0.5) * " + (SKIN_LOOK.poreAlbedo * 2).toFixed(3) + ";"
    ].join("\n") + "\n";
    var light = [
      "float ndl = dot(normal, keyDirView);",
      // Terminator band: peaks where the key light grazes the skin.
      "float phTerm = smoothstep(-0.4, 0.0, ndl) * (1.0 - smoothstep(0.0, 0.45, ndl));",
      // (not on the brow / lash cards: they are hair, and the liner must
      // stay near-black)
      "outgoingLight += diffuseColor.rgb * " + vec3Of(SKIN_LOOK.sssTint) + " * phTerm * " + strength.toFixed(2) + " * (1.0 - phCard);",
      // Unlit side: warm lift instead of a grey fill.
      "outgoingLight += diffuseColor.rgb * " + vec3Of(SKIN_LOOK.shadowWarm) + " * (1.0 - smoothstep(-0.3, 0.45, ndl)) * " + SKIN_LOOK.shadowLift.toFixed(2) + " * (1.0 - phCard);"
    ].join("\n") + "\n";
    if (part === "roughness") return roughness;
    if (part === "light") return light;
    return roughness + light;
  }

  // The last line of every three r128 mesh fragment shader. r128 has no
  // output_fragment include (that arrived in r129), so anything that must
  // run after lighting is spliced in front of this literal.
  var OUTPUT_LINE = "gl_FragColor = vec4( outgoingLight, diffuseColor.a );";

  var _keyDirView = new THREE.Vector3();
  var _keyDirWorld = new THREE.Vector3();

  // The key light's direction in the camera's view space, for every skin
  // material's SSS term (skin, head).
  function updateKeyDirection() {
    if (!camera) return;
    camera.updateMatrixWorld(true);
    camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
    _keyDirWorld.set(LIGHT_RIG.key.position[0], LIGHT_RIG.key.position[1], LIGHT_RIG.key.position[2]).normalize();
    _keyDirView.copy(_keyDirWorld).transformDirection(camera.matrixWorldInverse);
    var mats = skinMats.concat(headMats);
    var i;
    for (i = 0; i < mats.length; i++) {
      var shader = mats[i].userData.shader;
      if (shader && shader.uniforms.keyDirView) shader.uniforms.keyDirView.value.copy(_keyDirView);
    }
  }

  function injectSkinWrap(mat, amount) {
    var wrap = amount == null ? 0.22 : amount;
    var isHead = wrap < 0.1;
    var sss = isHead ? SKIN_LOOK.sssHead : SKIN_LOOK.sssBody;
    if (isHead) mat.userData.browColor = new THREE.Color(0x2b1d14);
    mat.customProgramCacheKey = function () { return "skinwrap-" + String(wrap); };
    mat.onBeforeCompile = function (shader) {
      var extra = "float phLip = 0.0;\nfloat phCard = 0.0;\n";
      shader.uniforms.keyDirView = { value: new THREE.Vector3(0, 0.5, 0.86) };
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <common>",
        "#include <common>\nuniform vec3 keyDirView;\nvarying float vPhEye;" + (isHead ? "\nuniform vec3 browColor;" : "")
      );
      var slots = mat.userData.eyeSlots || [-1, -1];
      shader.uniforms.eyeSlots = { value: new THREE.Vector2(slots[0], slots[1]) };
      shader.vertexShader = shader.vertexShader.replace(
        "#include <common>",
        "#include <common>\nuniform vec2 eyeSlots;\nvarying float vPhEye;"
      );
      shader.vertexShader = shader.vertexShader.replace(
        "#include <skinbase_vertex>",
        "#include <skinbase_vertex>\n" + eyeWeightVertexChunk()
      );
      if (isHead) {
        shader.uniforms.browColor = { value: mat.userData.browColor };
        extra = headPaintChunk();
      }
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <map_fragment>",
        "#include <map_fragment>\n" + extra
      );
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <roughnessmap_fragment>",
        "#include <roughnessmap_fragment>\n" + skinDetailChunk("roughness", sss)
      );
      shader.fragmentShader = shader.fragmentShader.replace(
        OUTPUT_LINE,
        skinDetailChunk("light", sss) + OUTPUT_LINE
      );
      mat.userData.shader = shader;
    };
  }

  function upgradeSkinMat(oldMat, envMap, wrapAmount) {
    var mat = new THREE.MeshPhysicalMaterial();
    if (oldMat && oldMat.map) mat.map = oldMat.map;
    if (oldMat && oldMat.normalMap) {
      mat.normalMap = oldMat.normalMap;
      mat.normalScale = new THREE.Vector2(0.9, 0.9);
    }
    if (oldMat && oldMat.color) mat.color.copy(oldMat.color);
    mat.roughness = SKIN_LOOK.roughness;
    mat.metalness = 0;
    mat.clearcoat = SKIN_LOOK.clearcoat;
    mat.clearcoatRoughness = SKIN_LOOK.clearcoatRoughness;
    mat.envMapIntensity = SKIN_LOOK.envMapIntensity;
    // Morphs are baked into the positions (bakeMorphs); the shader path stays off.
    mat.skinning = true;
    if (envMap) mat.envMap = envMap;
    injectSkinWrap(mat, wrapAmount);
    return mat;
  }

  // Style C hair, second cut. Measured on the GLB, every hair style is four
  // sculpted clump shells (0.12 x 0.30 m each; one connected surface per
  // mesh), not cards - the brick / step read design rejected on the #42 tip
  // is the shell's own facets and open edges, so no texture pass can fix
  // it, and there is no new GLB. The viewer therefore builds the hair it
  // needs at load, on the asset's own surface and skeleton:
  //  - buildHairCards grows a layer of thin strand cards on each shell
  //    (density per m^2 of shell), each card following the hair flow
  //    (gravity projected onto the surface, radiating from the crown),
  //    lifted `lift` off the shell, skinned like the shell vertex under each
  //    of its vertices, carrying the *surface* normal so it shades as part of
  //    the volume; the card shader paints tapered strands that end at random
  //    lengths - the fine cards and broken silhouette of the board;
  //  - hairBoundaryDistance bakes each shell vertex's distance to the
  //    nearest open edge (the hairline, the tips, the ear cut-outs), and the
  //    shell shader dissolves the last `edgeDissolve` metres into strands, so
  //    the hairline bites into the skin and the tips are not a wall;
  //  - hairNormalChunk blends every hair normal toward the scalp sphere
  //    (from the per-frame skull centre) so the shell's facets stop shading
  //    as bricks;
  //  - each hair mesh renders twice: an opaque core (alphaTest coreAlpha,
  //    depth write) and a blended fringe (no depth write), so strand fringes
  //    never punch holes through the hair behind them.
  // The baked strip (u 0.5-0.75, v 0-0.25 of ph_tex_HairAlbedo_<i>) is
  // still the shell's base shading, mirrored for the back mesh (Hair_<i>_1_0
  // maps to u 0.75-1.0 where its alpha is 0 - discarded since the export)
  // with its contrast flattened so the light edge columns stop drawing as
  // seams.
  var HAIR_LOOK = {
    strandFrequency: 420,
    strandDepth: 0.26,
    stripMean: 0.46,
    stripContrast: 0.45,
    metalness: 0.03,
    envMapIntensity: 0.06,
    scalpNormal: 0.65,
    edgeDissolve: 0.035,
    coreAlpha: 0.5,
    fringeAlpha: 0.14,
    eyeClear: 0.028,
    eyeClearFeather: 0.012
  };
  // Strand cards grown on the shells: ~4200 per m^2 of shell (about 400 on
  // the default style's front sweeps, ~2000 on its long back), 1.6 cm wide,
  // 8 cm long nominal (both jittered +-25%), 4 mm off the surface, four
  // segments following the surface; `albedo` scales the card colour to the
  // baked strip's mean so cards and shell read as one head of hair.
  // `flyawayShare` of the cards are flyaways: narrower, sparser wisps that
  // lift off the surface toward the tip (up to `flyawayLift`) and drift
  // sideways, so the hair's outline breaks into strands instead of a clean
  // shell curve.
  // No card is grown within `edgeMargin` of an open edge: the shell's own
  // dissolve fringes the hairline and the temple sweeps, and a card seeded
  // there reached half its width past the edge - across the eye's outer
  // corner on the default style (measured: the left eye's liner share fell
  // from 0.054 without hair to 0.002 with the first card layer).
  var HAIR_CARDS = { perSquareMetre: 4600, width: 0.016, length: 0.08, lift: 0.004, segments: 4, albedo: 0.74, flyawayShare: 0.3, flyawayLift: 0.018, overhang: 0.006, edgeMargin: 0.015 };

  // mulberry32: a small seeded PRNG so the card layout is the same on every
  // load (and in the tests).
  function seededRandom(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 0.01 mm grid; String(-0) is "0", so a pole's +-1e-17 jitter merges.
  function positionKey(arr, i) {
    return String(Math.round(arr[i * 3] * 1e5)) + "," + String(Math.round(arr[i * 3 + 1] * 1e5)) + "," + String(Math.round(arr[i * 3 + 2] * 1e5));
  }

  // Distance from each vertex to the nearest open edge of the surface, in
  // the geometry's units (metres for the hair shells), along the mesh's
  // edges. Vertices are merged by position first, because the shells are
  // split into UV islands whose borders are duplicated vertices - those
  // seams are not open edges. A closed surface returns 1.0 everywhere.
  function hairBoundaryDistance(geometry) {
    var pos = geometry.attributes.position;
    var arr = pos.array;
    var count = pos.count;
    var index = geometry.index ? geometry.index.array : null;
    var triCount = index ? index.length / 3 : count / 3;
    var canon = new Int32Array(count);
    var byKey = {};
    var canonCount = 0;
    var i, k;
    for (i = 0; i < count; i++) {
      var key = positionKey(arr, i);
      if (byKey[key] === undefined) byKey[key] = canonCount++;
      canon[i] = byKey[key];
    }
    var edgeUse = {};
    var neighbours = [];
    for (i = 0; i < canonCount; i++) neighbours.push([]);
    function edge(a, b) {
      var ca = canon[a];
      var cb = canon[b];
      if (ca === cb) return;
      var ek = ca < cb ? ca + "_" + cb : cb + "_" + ca;
      if (edgeUse[ek] === undefined) {
        edgeUse[ek] = 0;
        var len = Math.sqrt(
          Math.pow(arr[a * 3] - arr[b * 3], 2) +
          Math.pow(arr[a * 3 + 1] - arr[b * 3 + 1], 2) +
          Math.pow(arr[a * 3 + 2] - arr[b * 3 + 2], 2)
        );
        neighbours[ca].push([cb, len]);
        neighbours[cb].push([ca, len]);
      }
      edgeUse[ek] += 1;
    }
    for (i = 0; i < triCount; i++) {
      var a = index ? index[i * 3] : i * 3;
      var b = index ? index[i * 3 + 1] : i * 3 + 1;
      var c = index ? index[i * 3 + 2] : i * 3 + 2;
      edge(a, b);
      edge(b, c);
      edge(c, a);
    }
    var dist = new Float64Array(canonCount);
    var done = new Uint8Array(canonCount);
    var open = false;
    for (i = 0; i < canonCount; i++) dist[i] = Infinity;
    Object.keys(edgeUse).forEach(function (ek) {
      if (edgeUse[ek] !== 1) return;
      var parts = ek.split("_");
      dist[parseInt(parts[0], 10)] = 0;
      dist[parseInt(parts[1], 10)] = 0;
      open = true;
    });
    var out = new Float32Array(count);
    if (!open) {
      for (i = 0; i < count; i++) out[i] = 1;
      return out;
    }
    // Dijkstra with a linear scan: the shells have ~1,500 vertices.
    for (;;) {
      var best = -1;
      var bestD = Infinity;
      for (i = 0; i < canonCount; i++) {
        if (!done[i] && dist[i] < bestD) { bestD = dist[i]; best = i; }
      }
      if (best < 0) break;
      done[best] = 1;
      var ns = neighbours[best];
      for (k = 0; k < ns.length; k++) {
        var nd = bestD + ns[k][1];
        if (nd < dist[ns[k][0]]) dist[ns[k][0]] = nd;
      }
    }
    for (i = 0; i < count; i++) out[i] = isFinite(dist[canon[i]]) ? dist[canon[i]] : 1;
    return out;
  }

  var _hcA = new THREE.Vector3();
  var _hcB = new THREE.Vector3();
  var _hcC = new THREE.Vector3();

  // radius, the stylized small-eye look), large eyes the real proportion
  // (IRIS_SIZE_LARGE = 1.0) so what grows with Size is the eye and its
  // resting lid, not a white saucer. IRIS_RADIUS * IRIS_SIZE_SMALL stays
  // under the 0.35 lower-lid opening; the pupil top (PUPIL_RADIUS *
  // irisSize * 90deg -> sin) stays under the Size-0 lid at ~0.235 r.
  var IRIS_SIZE_SMALL = 1.10;
  var IRIS_SIZE_LARGE = 1.0;

  function irisSizeFor(eyeSize) {
    return IRIS_SIZE_SMALL - clamp01(eyeSize) * (IRIS_SIZE_SMALL - IRIS_SIZE_LARGE);
  }

  // Catchlight on the eyeball: smoothstep(lo, hi) on the dot between the
  // analytic sphere normal and a fixed view-space direction, mixed `mix`
  // toward white. The old spot (0.977, 0.992, 92%) was a ~12deg blob of the
  // *interpolated* vertex normal on the 20-segment Eyes_0 sphere: measured,
  // it whitened 15-49% of the visible iris and changed size with the facet
  // alignment between renders, and on a 10 px full-body iris it painted the
  // top half sclera-white. #36 ran (0.988, 0.996, 0.8): a <= 9deg spot with a
  // 4deg soft edge. The reference (a ZBrush close-up Maxwell picked) has a
  // hard glassy glint, so the edge is now 9.2deg -> 7.2deg (cos 0.987 ->
  // 0.992) and the spot 90% white; the same <= 9deg-class footprint, so a 7 px
  // full-body iris still keeps its colour. `mix2` is the softer secondary
  // glint low on the other side of the pupil. `emit` adds the main glint
  // unlit: measured, a diffuse-only glint under this light rig peaks near
  // the sclera's luminance (~170 of 255) because the top of the ball faces
  // away from the key light, so it never read as glass. `dir` is the
  // view-space direction whose sphere normal carries the glint. #36 used
  // (0.20, 0.16, 1.0), 9deg above the view axis - but both cameras sit
  // below the eyes, so a normal along the view axis already projects ~0.13
  // eyeball radii *above* the pupil, and 0.16 more put the spot at ~0.28 r,
  // under the upper lid: measured (aiming the glint at (0, 0, 1) put a
  // peak-255 spot at the pupil's top edge), the analytic catchlight had
  // been hidden since the lid came down, and the light spot people saw at
  // the pupil's upper-left was the fill light's clearcoat reflection. Level
  // with the axis it lands on the upper-right pupil edge, as in the
  // reference.
  // Style C (soft semi-real intimate): the reference pass's hard 2deg-edged
  // 90% glint read as a cartoon white dot on the #41 bust. The highlight is
  // now a *wet* one: a white core under 6deg (cos 0.9945) with a 3.5deg soft
  // edge, 84% white, a little less unlit lift - measured 1.0-1.5% of the
  // iris disc at 255 in the bust against the reference pass's 2.9%.
  var CATCHLIGHT = { lo: 0.986, hi: 0.9945, mix: 0.84, mix2: 0.22, emit: 0.5, dir: [0.22, -0.02, 1.0] };
  // Wet line: the tear meniscus along the lower lid margin, a soft bright
  // band on the eyeball just above where the lower lid rests (p.y ~ -0.35 in
  // the shader's units, lids skinned 1.0 to the eye bone so the proportion
  // holds at every Size). Applied after the pupil (so the pupil stays dark)
  // and before the catchlights; `strength` keeps it under the glint.
  var WETLINE = { from: -0.46, peak: -0.33, to: -0.22, strength: 0.4 };
  // The eyeball's shade under the upper lid (share of the sclera / iris
  // darkened at the top of the ball, p.y up). #36 ran 0.26; the reference
  // eye sits deep under a heavy lid, so 0.34.
  var LID_SHADE = 0.34;
  // Iris paint. #36 was a two-tone gradient with a 22%-wide rim at 30% of the
  // eye colour - a flat disc at the bust camera. Now: a luminous inner zone
  // around the pupil, saturated mid, radial fibres (two sine frequencies,
  // phase-wobbled) faded out at the pupil and the rim, and a darker, wider
  // limbal ring. `fibreStrength` is scaled per frame by the `irisDetail`
  // uniform (0 when the iris is under ~6 px on screen, 1 above ~14 px) so
  // the full-body eye does not shimmer under the idle sway. `glow` lifts the
  // iris unlit so a blue eye reads lit from within, as in the reference.
  var IRIS_LOOK = { rimStart: 0.66, rimMix: 0.88, rimTone: 0.18, fibreStrength: 1.0, glow: 0.18, innerGain: 2.6 };
  // TestFlight 1.2 (13): with the lids, gaze and 0.31 iris above, Maxwell
  // still read the eyes as too big - the whole eye, not the pupil. Eyes_0 is
  // two 22.2mm-radius spheres (44mm across on a 26cm head; a real eye is
  // 24mm). The eye bones are scaled, so the eyeball, the Head_0 eye cap
  // (both skinned 1.0 to eyeRoot_l/r) and the lid margins (0.8-0.99 to the
  // eye bone, fading to 0 by the brow) all shrink about the eye centre
  // together: the aperture closes in with the ball, the brow and cheek stay,
  // and the iris keeps its share of the smaller opening.
  //
  // 1.2 (14) shipped that as a fixed 0.70 (31mm eye) while the Eyes "Size"
  // slider only repainted the iris and opened the lid by 0.08, so Size min
  // and max looked alike. PR #33 drove this scale 0.42 -> 0.74 on its own,
  // and the TestFlight walk of that read as a pinprick at min (uniform scale
  // alone: a small ball with a small iris share under a wide-open lid) and a
  // wide stare at max. Size now couples three things - this bone scale,
  // upperLidDrop and irisSizeFor - so the scale itself stays in a beauty
  // band. PR #36 ran that band 0.46 -> 0.70 with the default kept on 0.58
  // (25.8mm, a real-eye proportion) and Maxwell's next craft walk read the
  // default as too small: at the Outfit full-body camera the iris is 5.1 CSS
  // px and the opening 4.3 px tall, a pinprick under the fringe. PR #40's
  // first pass moved the band to 0.52 -> 0.78 (default 0.65, iris 5.8 px),
  // the second to 0.60 -> 0.84 (default 0.72, iris 6.4 px), and his review
  // said "still too small, enlarge more" both times. The 1.2 (14) "a bit
  // large" verdict on 0.70 was an eye under a 0.16-0.20 stare lid with the
  // polygon-offset sclera ring, not this resting lid. Measured in headless
  // Chrome: the lid's share of the iris does not move with the bone scale
  // (the lid margin is skinned 1.0 to the eye bone, so the morph travel
  // scales with the ball) and neither does the sclera share (~0.32 at Size
  // 0.5, ~0.36 at Size 1 from 0.46 all the way to 1.0), so the whole band
  // moves up and the lid / iris curves stay as #36 left them, and the
  // 1.2 (11) sclera-dominant saucer cannot come back at any scale under
  // this lid - what grows is only the size. Nor does a big eye crowd the
  // brow: measured against the pupil, the upper lid margin rises 3.3 -> 7.7
  // px (1x, bust) from 0.60 to 1.0 and the brow's underside shadow rises
  // with it (the crease is part-weighted to the eye bone), so the lid-to-
  // brow gap stays 24-25 px at every scale; the opening grows downward and
  // outward because the gaze aims down at the camera. #40's third pass ran
  // 0.64 -> 0.88 (default 0.76) and Maxwell's review said "still too small"
  // a third time and pivoted to a reference (a ZBrush close-up: large almond
  // eyes under a heavy dark liner, luminous iris, hard catchlight): go past
  // 0.76 *and* add the feel - LASH_INK, LASH_LENGTH, OUTER_CORNER_LIFT,
  // LID_SHADE, IRIS_LOOK and CATCHLIGHT above carry that. That pass ran
  // 0.70 -> 0.94 (default 0.82) and his review was 「0.82改动方向是对的，
  // 能不能再大一点点」 - right direction, a little larger - so the small end
  // moves up and the top holds: EYE_SCALE_MIN 0.74 (Size 0, a 32.9mm eye
  // under the heaviest lid) to EYE_SCALE_MAX 0.96 (Size 1, 42.6mm; large is
  // the intent at the top end, the lid still covers the iris top, and it
  // stays under the unscaled GLB eye, 1.0 = the 1.2 (11)-(13) eye he asked
  // to shrink - measured, the lid-to-brow gap and the sclera share do not
  // move between 0.88 and 1.0). The default (Size 0.5) is EYE_SCALE 0.85
  // (37.7mm): its bust opening (~315 px^2 at 1x, liner on) sits just over
  // the 1.2 (14) stare's area (280-300 with its open lid) under a lid that
  // rests on the iris; at the Outfit camera the iris is 7.5 px and the
  // opening ~50 px^2 (0.58: 5.1 px / 26 px^2; 0.65: 5.8 / 32; 0.72: 6.4 /
  // 38; 0.76: 6.7 / 42; 0.82: 7.3 / 46). Re-applied on every applyLook, not
  // once at load.
  var EYE_SCALE_MIN = 0.74;
  var EYE_SCALE_MAX = 0.96;

  function eyeScaleFor(eyeSize) {
    return EYE_SCALE_MIN + clamp01(eyeSize) * (EYE_SCALE_MAX - EYE_SCALE_MIN);
  }

  // The default (Size 0.5) whole-eye scale, 0.85.
  var EYE_SCALE = eyeScaleFor(0.5);

  // Uniform scale on the eye bones. Absolute, so it can be re-applied; the
  // gaze solver only writes the quaternion and leaves it in place.
  function applyEyeScale(bones, scale) {
    var i;
    for (i = 0; i < bones.length; i++) {
      bones[i].scale.setScalar(scale);
      bones[i].updateMatrixWorld(true);
    }
  }

  // GLSL appended after map_fragment: paints sclera, iris, pupil and limbal
  // ring onto the Eyes_0 UVs, shades the eyeball under the upper lid so it
  // sits in the socket instead of glowing, and puts one catchlight per eye
  // at the same screen position (view-space direction against the analytic
  // sphere normal from the eye centres, so both eyes match, it follows the
  // gaze and its size does not depend on the mesh facets). Everything but
  // the sclera is sized from irisR.
  function irisFragmentChunk() {
    return [
      "#include <map_fragment>",
      "vec2 c = vec2(0.5623, 0.4378);",
      "vec2 p = (vUv - c) / vec2(0.061, 0.061);",
      "float d = length(p);",
      "float irisR = " + IRIS_RADIUS.toFixed(3) + " * irisSize;",
      "float pupilR = " + PUPIL_RADIUS.toFixed(3) + " * irisSize;",
      "float irisM = 1.0 - smoothstep(irisR - 0.012, irisR + 0.03, d);",
      "float pupilM = 1.0 - smoothstep(pupilR - 0.01, pupilR + 0.03, d);",
      // Off-white sclera, warmer toward the corners of the eye.
      "vec3 scleraCol = mix(vec3(0.92, 0.905, 0.88), vec3(0.975, 0.965, 0.95), 1.0 - smoothstep(0.30, 0.85, d));",
      // Upper-lid shadow: darkens the top of the eyeball (p.y is up) so the
      // eye reads as recessed under the lid rather than a bright doll bead.
      "float lidShade = smoothstep(-0.12, 0.30, p.y) * " + LID_SHADE.toFixed(2) + ";",
      "scleraCol *= 1.0 - lidShade;",
      // Iris keeps the eye colour's hue: a luminous collarette around the
      // pupil, saturated mid, radial fibres, then the dark limbal ring.
      "float irisT = clamp(d / irisR, 0.0, 1.0);",
      "float ang = atan(p.y, p.x);",
      "float fibre = 0.5 + 0.5 * sin(ang * 38.0 + 1.6 * sin(ang * 7.0 + irisT * 3.0));",
      "float fibre2 = 0.5 + 0.5 * sin(ang * 15.0 + 2.1);",
      "float fibres = mix(0.80, 1.20, fibre * 0.65 + fibre2 * 0.35);",
      "float fibreM = smoothstep(pupilR + 0.02, pupilR + 0.09, d) * (1.0 - smoothstep(irisR * 0.86, irisR, d));",
      "vec3 irisInner = irisColor * " + IRIS_LOOK.innerGain.toFixed(2) + " + vec3(0.08, 0.10, 0.06);",
      "vec3 irisMid = irisColor * 1.05;",
      "vec3 irisCol = mix(irisInner, irisMid, smoothstep(0.18, 0.75, irisT));",
      "irisCol *= mix(1.0, fibres, fibreM * " + IRIS_LOOK.fibreStrength.toFixed(2) + " * irisDetail);",
      // Radial layering (crypt rings) between collarette and rim.
      "float irisRing = 0.5 + 0.5 * sin(irisT * 26.0 + fibre * 2.4);",
      "irisCol *= mix(1.0, 0.86 + 0.28 * irisRing, fibreM * 0.6 * irisDetail);",
      "float rim = smoothstep(irisR * " + IRIS_LOOK.rimStart.toFixed(2) + ", irisR, d) * irisM;",
      "irisCol = mix(irisCol, irisColor * " + IRIS_LOOK.rimTone.toFixed(2) + ", rim * " + IRIS_LOOK.rimMix.toFixed(2) + ");",
      "irisCol *= 1.0 - lidShade * 0.8;",
      // A soft dark halo round the pupil so it does not read as a punched
      // hole in a flat disc.
      "float pupilHalo = 1.0 - smoothstep(pupilR, pupilR + 0.06, d);",
      "irisCol = mix(irisCol, irisCol * 0.7, pupilHalo * 0.5);",
      "vec3 pupilCol = vec3(0.04, 0.03, 0.03);",
      "vec3 col = mix(scleraCol, irisCol, irisM);",
      "col = mix(col, pupilCol, pupilM);",
      // Wet line along the lower lid (see WETLINE): a soft meniscus
      // highlight, warm-white, kept off the pupil.
      "float wet = smoothstep(" + WETLINE.from.toFixed(2) + ", " + WETLINE.peak.toFixed(2) + ", p.y) * (1.0 - smoothstep(" + WETLINE.peak.toFixed(2) + ", " + WETLINE.to.toFixed(2) + ", p.y));",
      "col = mix(col, vec3(0.98, 0.96, 0.94), wet * " + WETLINE.strength.toFixed(2) + " * (1.0 - pupilM));",
      // Catchlights from a fixed view-space direction (upper right on
      // screen), identical on both eyes. The normal is the exact sphere
      // normal (fragment minus the nearer eye centre, both in view space):
      // the interpolated vertex normal of the 20-segment sphere made the
      // spot bulge or shrink with the facet under it.
      "vec3 fragPos = -vViewPosition;",
      "vec3 toL = fragPos - eyeCentreL;",
      "vec3 toR = fragPos - eyeCentreR;",
      "vec3 ballN = normalize(dot(toL, toL) < dot(toR, toR) ? toL : toR);",
      "float spec = smoothstep(" + CATCHLIGHT.lo.toFixed(3) + ", " + CATCHLIGHT.hi.toFixed(3) + ", dot(ballN, normalize(vec3(" + CATCHLIGHT.dir.map(function (v) { return v.toFixed(2); }).join(", ") + "))));",
      "float spec2 = smoothstep(0.993, 0.998, dot(ballN, normalize(vec3(-0.22, -0.26, 1.0))));",
      "col = mix(col, vec3(1.0), spec * " + CATCHLIGHT.mix.toFixed(2) + ");",
      "col = mix(col, vec3(1.0), spec2 * " + CATCHLIGHT.mix2.toFixed(2) + ");",
      "diffuseColor.rgb = col;",
      // The eyeball faces the dark purple ground of the hemisphere light, so
      // lift it a little unlit (more on the sclera) instead of letting the
      // lower white go steel grey, and let the iris glow from within.
      "totalEmissiveRadiance += col * (0.10 + 0.16 * (1.0 - irisM)) + irisCol * irisM * (1.0 - pupilM) * " + IRIS_LOOK.glow.toFixed(2) + " + vec3(spec * " + CATCHLIGHT.emit.toFixed(2) + ");"
    ].join("\n");
  }

  function upgradeIrisMat(oldMat, envMap) {
    var mat = new THREE.MeshPhysicalMaterial();
    if (oldMat && oldMat.map) mat.map = oldMat.map;
    mat.color.setRGB(1, 1, 1);
    mat.roughness = 0.3;
    mat.metalness = 0;
    // Style C: the wet look is the painted wet line and catchlight; the
    // clearcoat only carries a soft environment sheen. At 0.45 / 0.2 the
    // fill light's reflection sat on the pupil's upper-left as a warm blob
    // (the "light spot" of #36-#41) and, with the warm Style C fill, lit the
    // top of the Size 0 pupil past the lid probe.
    mat.clearcoat = 0.3;
    mat.clearcoatRoughness = 0.32;
    // The lavender sky in makeEnvMap tinted the sclera blue-grey; keep just
    // enough reflection for a wet look.
    mat.envMapIntensity = 0.05;
    mat.skinning = true;
    // Head_0 carries a skin-textured copy of both eyeballs (dished to ~0.7 r
    // at the iris, flush with the sphere at the rim); pull the real eyeball
    // forward in depth by a constant so the copy cannot z-fight skin speckles
    // across it. Constant only: a slope-scaled factor (-2 until this change)
    // grows with the polygon's per-pixel depth slope, which explodes at the
    // sphere's grazing rim and is steeper the smaller the eye is drawn, so
    // the eyeball's silhouette won the depth test against the lid skin in
    // front of it - a ring of sclera round the lids in the full-body view
    // (45% sclera share vs 36% in the bust for the same lid weight) and a
    // bare bead at small Sizes.
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = 0;
    mat.polygonOffsetUnits = -4;
    if (envMap) mat.envMap = envMap;
    mat.userData.irisColor = new THREE.Color(0x2e4d7a);
    mat.userData.irisSize = 1.0;
    mat.onBeforeCompile = function (shader) {
      shader.uniforms.irisColor = { value: mat.userData.irisColor };
      shader.uniforms.irisSize = { value: mat.userData.irisSize };
      shader.uniforms.eyeCentreL = { value: new THREE.Vector3() };
      shader.uniforms.eyeCentreR = { value: new THREE.Vector3() };
      shader.uniforms.irisDetail = { value: 1 };
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <common>",
        "#include <common>\nuniform vec3 irisColor;\nuniform float irisSize;\nuniform vec3 eyeCentreL;\nuniform vec3 eyeCentreR;\nuniform float irisDetail;"
      );
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <map_fragment>",
        irisFragmentChunk()
      );
      mat.userData.shader = shader;
    };
    return mat;
  }

  function addGroundContact() {
    var tex = canvasTexture(function (ctx, size) {
      var g = ctx.createRadialGradient(size / 2, size / 2, 4, size / 2, size / 2, size / 2);
      g.addColorStop(0, "rgba(8,4,16,0.45)");
      g.addColorStop(1, "rgba(8,4,16,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
    }, 128);
    tex.encoding = THREE.LinearEncoding;
    var mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(0.95, 0.48),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
    );
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = 0.008;
    scene.add(mesh);
  }

  var _poseParentQ = new THREE.Quaternion();
  var _poseWorld = new THREE.Quaternion();
  var _poseDelta = new THREE.Quaternion();
  var _axisZ = new THREE.Vector3(0, 0, 1);
  var _ikS = new THREE.Vector3();
  var _ikW = new THREE.Vector3();
  var _ikE = new THREE.Vector3();
  var _ikD = new THREE.Vector3();
  var _ikP = new THREE.Vector3();
  var _aimA = new THREE.Vector3();
  var _aimB = new THREE.Vector3();
  var _aimCur = new THREE.Vector3();
  var _aimTgt = new THREE.Vector3();

  // clavicle / upperarm / lowerarm / hand (not twist helpers, not fingers).
  function isPoseArmBone(name) {
    var bn = (name || "").toLowerCase();
    if (bn.indexOf("twist") >= 0) return false;
    if (bn.indexOf("upperarm") >= 0 || bn.indexOf("lowerarm") >= 0) return true;
    if (bn.indexOf("clavicle") >= 0 || bn.indexOf("shoulder") >= 0) return true;
    if (bn.indexOf("hand") < 0) return false;
    return (
      bn.indexOf("thumb") < 0 &&
      bn.indexOf("index") < 0 &&
      bn.indexOf("middle") < 0 &&
      bn.indexOf("ring") < 0 &&
      bn.indexOf("pinky") < 0 &&
      bn.indexOf("metacarpal") < 0
    );
  }

  function resetArmBones() {
    var i;
    for (i = 0; i < armBones.length; i++) {
      var rest = armRests[i];
      armBones[i].quaternion.set(rest.qx, rest.qy, rest.qz, rest.qw);
    }
  }

  // Multiply the bone's world orientation by `delta` (a world-space rotation).
  function rotateBoneWorldQ(bone, delta) {
    if (!bone) return;
    if (bone.parent) {
      bone.parent.getWorldQuaternion(_poseParentQ);
    } else {
      _poseParentQ.identity();
    }
    _poseWorld.copy(_poseParentQ).multiply(bone.quaternion);
    _poseWorld.premultiply(delta);
    _poseParentQ.invert();
    bone.quaternion.copy(_poseParentQ).multiply(_poseWorld);
    bone.updateMatrixWorld(true);
  }

  function rotateBoneWorld(bone, axis, angle) {
    if (!bone || !angle) return;
    _poseDelta.setFromAxisAngle(axis, angle);
    rotateBoneWorldQ(bone, _poseDelta);
  }

  var _gazeFull = new THREE.Quaternion();
  var _gazeStep = new THREE.Quaternion();
  var _gazeQ = new THREE.Quaternion();
  var _gazePos = new THREE.Vector3();
  var _gazeFwd = new THREE.Vector3();
  var _gazeWant = new THREE.Vector3();

  // Point `bone`'s local +Z (the iris axis of eyeRoot_l/r in bozo-male.glb)
  // at `target` (world space), starting from its rest orientation `rest` and
  // turning at most `maxAngle` radians. Returns the angle actually turned.
  function aimBoneAt(bone, rest, target, maxAngle) {
    if (!bone || !rest || !target) return 0;
    bone.quaternion.copy(rest);
    bone.updateWorldMatrix(true, false);
    bone.getWorldPosition(_gazePos);
    _gazeWant.subVectors(target, _gazePos);
    if (_gazeWant.lengthSq() < 1e-8) return 0;
    _gazeWant.normalize();
    bone.getWorldQuaternion(_gazeQ);
    _gazeFwd.set(0, 0, 1).applyQuaternion(_gazeQ).normalize();
    _gazeFull.setFromUnitVectors(_gazeFwd, _gazeWant);
    _gazeStep.identity();
    _gazeStep.rotateTowards(_gazeFull, maxAngle);
    rotateBoneWorldQ(bone, _gazeStep);
    return Math.min(maxAngle, _gazeFwd.angleTo(_gazeWant));
  }

  // Both eyes converge on the camera every frame (after the idle head sway),
  // so the irises meet the viewer instead of staring parallel past them.
  function aimEyes(target) {
    var i;
    for (i = 0; i < eyeBones.length; i++) {
      aimBoneAt(eyeBones[i], eyeRests[i], target, MAX_GAZE_ANGLE);
    }
  }

  var _eyeCentreL = new THREE.Vector3();
  var _eyeCentreR = new THREE.Vector3();

  // The first two eye bones' centres in `cam`'s view space (bones[0] -> outL,
  // bones[1] -> outR; the shader takes whichever is nearer, so the order
  // does not matter). Feeds the analytic eyeball normal in irisFragmentChunk.
  function viewSpaceEyeCentres(bones, cam, outL, outR) {
    cam.updateMatrixWorld(true);
    cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
    var outs = [outL, outR];
    var i;
    for (i = 0; i < bones.length && i < 2; i++) {
      bones[i].updateWorldMatrix(true, false);
      bones[i].getWorldPosition(outs[i]).applyMatrix4(cam.matrixWorldInverse);
    }
  }

  // Eyes_0 is a 22.2 mm sphere; its radius in device pixels at the eye's
  // depth decides how much iris detail the shader may draw (see IRIS_LOOK).
  var EYEBALL_RADIUS_M = 0.0222;
  var IRIS_DETAIL_PX = { off: 6, full: 14 };

  function irisDetailFor(radiusPx) {
    return clamp01((radiusPx - IRIS_DETAIL_PX.off) / (IRIS_DETAIL_PX.full - IRIS_DETAIL_PX.off));
  }

  function updateEyeCentres() {
    if (!camera || eyeBones.length < 2) return;
    viewSpaceEyeCentres(eyeBones, camera, _eyeCentreL, _eyeCentreR);
    var depth = Math.max(1e-6, -_eyeCentreL.z);
    var pxPerMetre = (window.innerHeight / 2) / Math.tan((camera.fov * Math.PI) / 360) / depth;
    var dpr = renderer ? renderer.getPixelRatio() : 1;
    var detail = irisDetailFor(EYEBALL_RADIUS_M * eyeBones[0].scale.x * pxPerMetre * dpr);
    var i;
    for (i = 0; i < eyeMats.length; i++) {
      var shader = eyeMats[i].userData.shader;
      if (!shader || !shader.uniforms.eyeCentreL) continue;
      shader.uniforms.eyeCentreL.value.copy(_eyeCentreL);
      shader.uniforms.eyeCentreR.value.copy(_eyeCentreR);
      if (shader.uniforms.irisDetail) shader.uniforms.irisDetail.value = detail;
    }
  }

  // Turn `bone` so the segment bone -> child points along `dir` (world space).
  function aimBone(bone, child, dir) {
    if (!bone || !child) return;
    bone.getWorldPosition(_aimA);
    child.getWorldPosition(_aimB);
    _aimCur.subVectors(_aimB, _aimA);
    if (_aimCur.lengthSq() < 1e-10) return;
    _aimCur.normalize();

    _poseDelta.setFromUnitVectors(_aimCur, _aimTgt);
    rotateBoneWorldQ(bone, _poseDelta);
  }

  // Two-bone IK: elbow position for shoulder S, wrist target W, segment
  // lengths L1/L2, with the elbow pushed toward `pole`.
  function solveElbow(S, W, L1, L2, pole, out) {
    _ikD.subVectors(W, S);
    var dist = _ikD.length();
    var maxReach = L1 + L2 - 0.005;
    var minReach = Math.abs(L1 - L2) + 0.005;

    _ikP.addScaledVector(_ikD, -_ikP.dot(_ikD));

      _ikP.addScaledVector(_ikD, -_ikP.dot(_ikD));

    _ikP.normalize();
    out.copy(S).addScaledVector(_ikD, a).addScaledVector(_ikP, h);
    return out;
  }

  function sideBone(base, side) {
    return masterBones[base + "_" + side] || null;
  }

  // Pose one arm. `t` is authored for the LEFT side (+X = the character's
  // left) as offsets from the shoulder joint; the right side mirrors X.
  function poseArm(side, t) {

    var lower = sideBone("lowerarm", side);
    var hand = sideBone("hand", side);
    var finger = sideBone("middle_01", side) || sideBone("middle_metacarpal", side);
    if (!upper || !lower || !hand) return;

    lower.getWorldPosition(_ikE);
    var L1 = _ikE.distanceTo(_ikS);
    hand.getWorldPosition(_ikW);
    var L2 = _ikW.distanceTo(_ikE);
    _ikW.set(_ikS.x + m * t.wrist[0], _ikS.y + t.wrist[1], _ikS.z + t.wrist[2]);
    solveElbow(_ikS, _ikW, L1, L2, [m * t.pole[0], t.pole[1], t.pole[2]], _ikE);
    aimBone(upper, lower, [_ikE.x - _ikS.x, _ikE.y - _ikS.y, _ikE.z - _ikS.z]);
    lower.getWorldPosition(_ikE);
    aimBone(lower, hand, [_ikW.x - _ikE.x, _ikW.y - _ikE.y, _ikW.z - _ikE.z]);
    // Forearm twist (pronation, radians, mirrored on the right): the aims
    // above are shortest arcs, so the palm ends up wherever the rest twist
    // lands it - beside the thigh that is inward, but a hand carried across
    // the body arrives palm to the camera. The twist turns the forearm about
    // its own axis before the hand is aimed, so the wrist stays put and only
    // the palm facing changes.
    if (t.twist) {
      hand.getWorldPosition(_ikW);
      _ikD.subVectors(_ikW, _ikE).normalize();

    }
  }

  // Finger phalanges (index/middle/ring/pinky/thumb _01 / _02, not the
  // metacarpals): the soft curl the poses put on the hands.
  function isFingerBone(name) {
    return /^(index|middle|ring|pinky|thumb)_0[0-9]_[lr]$/.test(name || "");
  }

  function fingerSide(name) {
    return name.slice(-1);
  }

  // The finger bones in bozo-male.glb carry local +Y along the phalanx and
  // local +Z across the hand from the pinky to the index, so a flex toward
  // the palm is a turn about local Z: positive on the left hand, negative on
  // the right (the right rig is the left mirrored, which flips that axis;
  // the first render with the signs the other way hyperextended every
  // finger into a splayed claw).
  // `curl` 0 leaves the rest hand (a flat board), 1 is a loose fist; the
  // poses use 0.15-0.55, the second phalanx curling a little more than the
  // first and the thumb half as much.
  var FINGER_CURL_RAD = { first: 0.40, second: 0.50, thumb: 0.5 };

  function resetFingerBones() {
    var i;

      fingerBones[i].quaternion.copy(fingerRests[i]);
    }
  }

  function poseFingers(side, curl) {
    var amount = clamp01(curl);
    if (!amount) return;
    var m = side === "r" ? -1 : 1;
    var i;
    for (i = 0; i < fingerBones.length; i++) {
      var bone = fingerBones[i];
      var name = rigName(bone);
      if (fingerSide(name) !== side) continue;
      var angle = name.indexOf("_02_") > 0 ? FINGER_CURL_RAD.second : FINGER_CURL_RAD.first;
      if (name.indexOf("thumb") === 0) angle *= FINGER_CURL_RAD.thumb;

      bone.quaternion.multiply(_curlQ);
    }
  }

  // The stance bones: pelvis, spine chain, first neck bone, both legs. The
  // head bone stays with the idle head sway (headBones / headRests).
  var STANCE_BONE_NAMES = [
    "pelvis", "spine_01", "spine_02", "spine_03", "spine_04", "spine_05", "neck_01",
    "thigh_l", "calf_l", "foot_l", "thigh_r", "calf_r", "foot_r"
  ];
  var SPINE_BONE_NAMES = ["spine_01", "spine_02", "spine_03", "spine_04", "spine_05"];

  // Collect the finger and stance bones (and their rest transforms) from the
  // master skeleton; called once after retargetSkeletons, before the first
  // pose. Exposed so the rig tests can run it on a synthetic skeleton.
  function collectPoseBones() {
    fingerBones = [];
    fingerRests = [];
    stanceBones = [];
    stanceRests = [];
    kneeIdle = null;
    Object.keys(masterBones).forEach(function (name) {
      if (isFingerBone(name)) {
        fingerBones.push(masterBones[name]);
        fingerRests.push(masterBones[name].quaternion.clone());
      }
    });
    STANCE_BONE_NAMES.forEach(function (name) {
      var bone = masterBones[name];
      if (!bone) return;
      stanceBones.push(bone);
      stanceRests.push({ q: bone.quaternion.clone(), p: bone.position.clone() });
    });
  }

  function resetStanceBones() {
    var i;
    for (i = 0; i < stanceBones.length; i++) {
      stanceBones[i].quaternion.copy(stanceRests[i].q);
      stanceBones[i].position.copy(stanceRests[i].p);
    }
    kneeIdle = null;
  }

  // Whether the loaded rig has the pelvis / spine / leg chain the stance
  // writes (bozo-male.glb does: pelvis, spine_01..05, neck_01, thigh / calf /
  // foot on both sides). Without it applyStance is a no-op and the figure
  // falls back to arm asymmetry alone.
  function hasPelvicChannel() {
    return !!(masterBones.pelvis && masterBones.thigh_l && masterBones.thigh_r &&
      masterBones.calf_l && masterBones.calf_r && masterBones.spine_03);
  }

  var _axisX = new THREE.Vector3(1, 0, 0);
  var _axisY = new THREE.Vector3(0, 1, 0);
  var _stanceV = new THREE.Vector3();
  var _shiftV = new THREE.Vector3();
  var _stanceQ = new THREE.Quaternion();
  var _stanceS = new THREE.Vector3();
  var _footA = new THREE.Vector3();
  var _footB = new THREE.Vector3();
  var DEG = Math.PI / 180;

  // Body Style C "soft semi-real intimate stance" (design sheet 2026-09-07):
  // a soft contrapposto, not the #42 soldier stand. The weight is on one leg
  // (`weightSide`, +x = the character's left); that hip rides up and out,
  // the pelvis turns a few degrees so the free hip comes forward, the spine
  // unwinds part of the turn and tilts the shoulders the other way, the neck
  // takes most of that tilt back out so the head stays near level, and the
  // free knee carries a micro-bend with a slow idle swing. Angles in degrees,
  // shift in metres. Design brief: pelvic yaw 3-6, shoulder counter-tilt
  // 2-4; the knee bend is what the hip drop needs to keep the free foot on
  // the ground (0.85 m leg: 0.09 m x sin 3 = 4.7 mm, and a 12 deg knee
  // lifts the foot 4.7 mm; the weight foot is re-planted at its rest height
  // afterwards). Rendered at 0.02 m / 2.5 deg / 10 deg first: read as
  // barely a hip at the phone's full-body size, so the shift and roll went
  // up a notch.
  var STANCE = {
    weightSide: "l",
    pelvisYawDeg: 5,
    pelvisRollDeg: 3,
    pelvisShift: 0.03,
    shoulderTiltDeg: 3,
    chestYawShare: 0.5,
    headLevelShare: 0.7,
    freeKneeDeg: 12,
    freeThighOutDeg: 2,
    freeToeOutDeg: 7,
    weightToeOutDeg: 3,
    idleKneeDeg: 1.2,
    idleKneeRate: 0.55,
    legLength: 0.85
  };

  // Move `bone` by `delta` (world metres) without turning it.
  function translateBoneWorld(bone, delta) {

    bone.parent.getWorldQuaternion(_stanceQ);
    bone.parent.getWorldScale(_stanceS);
    _stanceV.copy(delta).applyQuaternion(_stanceQ.invert());
    _stanceV.set(
      _stanceV.x / (_stanceS.x || 1),
      _stanceV.y / (_stanceS.y || 1),
      _stanceV.z / (_stanceS.z || 1)
    );
    bone.position.add(_stanceV);
    bone.updateMatrixWorld(true);
  }

  // Write `stance` onto the stance bones from their rest pose. Returns
  // whether the pelvic channel existed and the stance was written.
  function applyStance(stance) {
    resetStanceBones();
    if (!hasPelvicChannel() || !stance) return false;
    var m = stance.weightSide === "r" ? -1 : 1;
    var weight = stance.weightSide === "r" ? "r" : "l";
    var free = weight === "l" ? "r" : "l";
    var pelvis = masterBones.pelvis;
    var weightFoot = masterBones["foot_" + weight];
    var freeFoot = masterBones["foot_" + free];
    pelvis.updateMatrixWorld(true);
    if (weightFoot) weightFoot.getWorldPosition(_footA);

    // Pelvis: the free hip forward, the weight hip up and out.
    rotateBoneWorld(pelvis, _axisY, m * stance.pelvisYawDeg * DEG);
    rotateBoneWorld(pelvis, _axisZ, m * stance.pelvisRollDeg * DEG);
    translateBoneWorld(pelvis, _shiftV.set(m * stance.pelvisShift, 0, 0));

    // Legs: undo the pelvis roll and lean them back under the feet so both
    // feet stay where the rest pose planted them (x), toes out a little.
    var legLean = stance.pelvisShift / stance.legLength;
    var thighW = masterBones["thigh_" + weight];
    var thighF = masterBones["thigh_" + free];
    var calfF = masterBones["calf_" + free];
    rotateBoneWorld(thighW, _axisZ, -m * stance.pelvisRollDeg * DEG - m * legLean);
    rotateBoneWorld(thighW, _axisY, m * stance.weightToeOutDeg * DEG);
    rotateBoneWorld(thighF, _axisZ, -m * stance.pelvisRollDeg * DEG - m * legLean - m * stance.freeThighOutDeg * DEG);
    rotateBoneWorld(thighF, _axisY, -m * stance.freeToeOutDeg * DEG);
    // Free knee: thigh forward by half the bend, shin back by the whole
    // bend, foot levelled again (world +X turns a hanging leg backward).
    var knee = stance.freeKneeDeg * DEG;
    rotateBoneWorld(thighF, _axisX, -knee / 2);
    rotateBoneWorld(calfF, _axisX, knee);
    rotateBoneWorld(freeFoot, _axisX, -knee / 2);

    // Spine: unwind part of the pelvic turn and tilt the shoulders against
    // the hips, spread over the five spine bones so no single joint kinks.
    var spineRoll = -m * (stance.pelvisRollDeg + stance.shoulderTiltDeg) * DEG / SPINE_BONE_NAMES.length;
    var spineYaw = -m * stance.pelvisYawDeg * stance.chestYawShare * DEG / SPINE_BONE_NAMES.length;
    SPINE_BONE_NAMES.forEach(function (name) {
      rotateBoneWorld(masterBones[name], _axisZ, spineRoll);
      rotateBoneWorld(masterBones[name], _axisY, spineYaw);
    });
    // Neck: most of the shoulder tilt back out, so the head sits near level
    // with a hint of lean toward the weight side.
    rotateBoneWorld(masterBones.neck_01, _axisZ, m * stance.shoulderTiltDeg * stance.headLevelShare * DEG);

    // Plant the weight foot at its rest height (the hip rise lifted it).
    if (weightFoot) {
      weightFoot.getWorldPosition(_footB);
      translateBoneWorld(pelvis, _shiftV.set(0, _footA.y - _footB.y, 0));
    }

      ? {
          thigh: thighF, calf: calfF, foot: freeFoot,
          rests: [thighF.quaternion.clone(), calfF.quaternion.clone(), freeFoot.quaternion.clone()],
          amplitude: stance.idleKneeDeg * DEG,
          rate: stance.idleKneeRate
        }
      : null;
    return true;
  }

  // Idle: the free knee breathes a degree or so around its posed bend, in
  // step with nothing else (its own slow rate), so the stance is not a
  // statue. Runs every frame from the posed quaternions.
  function idleKnee(t) {

    kneeIdle.thigh.quaternion.copy(kneeIdle.rests[0]);
    kneeIdle.calf.quaternion.copy(kneeIdle.rests[1]);
    kneeIdle.foot.quaternion.copy(kneeIdle.rests[2]);
